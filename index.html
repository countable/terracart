<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#111" />
  <!-- iOS PWA: launch fullscreen with a dark status bar when added to home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Terracart" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <!-- Browser-tab favicon (chicken sprite). .ico bundles 16/32/48; PNGs are
       crisp fallbacks. Bump ?v= when the icon art changes, to bust caches. -->
  <link rel="icon" href="favicon.ico?v=1" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32.png?v=1" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16.png?v=1" sizes="16x16" />
  <title>map-game prototype</title>
  <style>
    /* Phone-preview gutters — declared ONLY on :root so the JS-set values
       on document.documentElement aren't shadowed by a body-level
       declaration. (Declaring on `html, body` makes body re-declare 0px
       which then wins for every descendant, defeating the cascade.) When
       the viewport is wider than the phone column (landscape / desktop),
       fitGame sets these so all HUD overlays tuck inside the narrow phone
       column instead of stretching to the browser edges. On real phones
       (portrait) both stay 0. */
    :root {
      --phone-left:  0px;
      --phone-right: 0px;
      /* Palette — the DOM half of the shared look. Mirrors the UI_* constants
         in src/util.js (which the canvas text and Phaser graphics draw with);
         keep the two in sync when either changes. Reach for the role that
         fits rather than adding a near-duplicate shade. */
      --gold:       #ffe066;   /* the game's gold: money, highlights, accents */
      --gold-deep:  #ffd23a;   /* saturated gold — shiny + jackpot accents    */
      --gold-dark:  #c8a64a;   /* dim gold — borders, rules, inactive accents */
      --gold-pale:  #fff3b0;   /* pale gold — the lit core of a highlight     */
      --green:      #a7ffb0;   /* success / ready / energy gain               */
      --danger:     #b71c1c;   /* destructive action + error surfaces         */
      --danger-ink: #ff8a7a;   /* destructive action as TEXT on a dark ground */
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #111; color: #ddd;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      /* Block iOS Safari's elastic rubber-band overscroll on fast swipes —
         touch-action: none alone doesn't suppress it. */
      overscroll-behavior: none;
      touch-action: none;
      /* Kill every accidental "selection" gesture — the game has no text
         input, so long-press text selection, iOS's blue-loupe magnifier
         and callout menu, drag-to-select on desktop, and the grey tap
         flash on Android/iOS are all pure noise that get triggered by
         normal play (long-press to mine, double-tap on a house, etc.). */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #frame {
      position: absolute;
      top: 0; bottom: 0;
      left:  var(--phone-left, 0px);
      right: var(--phone-right, 0px);
      overflow: hidden;
    }
    /* Phone-preview vignette — a thin border that frames the simulated phone
       column on desktop so the dev can see exactly where the device edge is.
       Hidden on real portrait viewports (--phone-left = 0). */
    body.phone-preview::before {
      content: '';
      position: fixed;
      top: 0; bottom: 0;
      left:  var(--phone-left,  0px);
      right: var(--phone-right, 0px);
      border-left:  1px solid #333;
      border-right: 1px solid #333;
      box-shadow: 0 0 0 9999px #0a0a0a;
      pointer-events: none;
      z-index: 99;
    }
    /* Fixed 352×844 native size — 352 = VIEW_CELLS × CELL_PX so the 11×11
       map view fills the canvas with no side padding. We scale the whole game
       (canvas + overlays) with a CSS transform from JS so it fits any viewport
       while keeping a single coordinate system internally. */
    #game {
      width: 352px; height: 844px;
      background: #000;
      box-shadow: 0 0 24px #000a;
      position: absolute; top: 0; left: 0;
      transform-origin: top left;
    }
    /* touch-action doesn't inherit, so the <body> rule above doesn't reach the
       Phaser canvas — the surface that catches almost every tap. Without this,
       pinch and double-tap zoom land directly on the canvas. Phaser's pointer
       events still fire; this only suppresses the browser's default zoom/pan. */
    #game, #game canvas { touch-action: none; }
    /* The movement stick (#move-pad) is position:fixed on <body> at z-index 6
       — but every modal dialog lives inside #game, whose transform makes its
       own stacking context, so a modal can never climb above the body-level
       stick. While a dialog is open the bottom-right stick would sit ON TOP of
       it and swallow the taps meant to dismiss it (you could still walk but not
       close the modal). MapScene._installModalPadGate toggles body.modal-open
       whenever a .game-modal is shown; hide the stick then. */
    body.modal-open #move-pad { display: none !important; }
    #banner {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff; padding: 4px 10px; border-radius: 6px;
      font-size: 12px; display: none; z-index: 10;
    }
    /* Copyable error overlay. Unlike #banner (a transient connection-status
       flash), this stays on screen until dismissed and is fully selectable so
       the whole message + stack can be read or copied on a phone where
       DevTools isn't reachable. */
    #errbar {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      max-width: min(92vw, 560px); max-height: 60vh; overflow: auto;
      background: var(--danger); color: #fff; padding: 8px 10px; border-radius: 8px;
      font: 12px/1.45 ui-monospace, monospace; display: none; z-index: 20;
      box-shadow: 0 4px 16px #0008;
      white-space: pre-wrap; word-break: break-word;
      -webkit-user-select: text; user-select: text;
    }
    #errbar .errmsg { font-weight: 700; }
    #errbar .errstack {
      margin-top: 6px; font-size: 11px; opacity: .92; white-space: pre-wrap;
    }
    #errbar .errbtns {
      display: flex; gap: 8px; margin-top: 8px;
      position: sticky; bottom: 0;
    }
    #errbar button {
      font: 700 12px ui-monospace, monospace; color: var(--danger); background: #fff;
      border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer;
    }
    #hud {
      position: fixed; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      left:  calc(var(--phone-left,  0px) + 8px);
      right: calc(var(--phone-right, 0px) + 8px);
      font-size: 11px; color: #fff8; pointer-events: none; z-index: 5;
      font-family: ui-monospace, monospace;
    }
    /* Top-row HUD is position:fixed and lives outside #game (see the comment
       on #hud below) so it anchors to the visual viewport instead of #game's
       scaled box. env(safe-area-inset-top) clears the iPhone notch. */
    #money {
      position: fixed; top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(var(--phone-right, 0px) + 10px);
      background: #000a; color: var(--gold); padding: 4px 10px;
      border-radius: 8px;
      font: 700 16px ui-monospace, monospace;
      pointer-events: none; z-index: 7;
    }
    #energy {
      position: fixed; top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(var(--phone-right, 0px) + 88px);
      background: #000a; color: var(--green); padding: 4px 10px;
      border: 2px solid #4a8c4a; border-radius: 8px;
      font: 700 14px ui-monospace, monospace;
      pointer-events: none; z-index: 7;
      display: flex; flex-direction: column; gap: 3px; align-items: stretch;
    }
    /* Thin progress bar under the ⚡ readout. Fill width + colour are set in
       updateEnergyDOM(): green normally, yellow at/below 30%, red when critical. */
    #energy-bar {
      height: 4px; border-radius: 2px; overflow: hidden;
      background: #ffffff22;
    }
    #energy-bar-fill {
      height: 100%; width: 100%; border-radius: 2px;
      background: var(--green);
      transition: width 0.15s linear, background-color 0.15s linear;
    }
    #menu { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px));
            left: calc(var(--phone-left, 0px) + 8px); z-index: 8; }
    #menu summary {
      list-style: none; cursor: pointer; user-select: none;
      background: #000a; color: #ddd;
      border: 2px solid #444; border-radius: 8px;
      padding: 2px 8px; font: 700 16px ui-monospace, monospace;
      line-height: 1.4;
    }
    #menu summary::-webkit-details-marker { display: none; }
    #menu[open] summary { border-color: #888; }
    #menu .items {
      margin-top: 4px; min-width: 140px;
      background: #000c; border: 2px solid #444; border-radius: 8px;
      padding: 4px; display: flex; flex-direction: column; gap: 2px;
    }
    #menu .items button {
      background: transparent; color: #ddd; border: 0;
      text-align: left; padding: 6px 8px; border-radius: 4px;
      font: 12px ui-monospace, monospace; cursor: pointer;
    }
    #menu .items button:hover { background: #fff2; }
    #menu .items button.danger { color: var(--danger-ink); }
    /* Saved-game rows: a name button (selects/plays the slot) + a delete ✕.
       The active slot is marked with a leading ✓ and highlighted. */
    #menu .save-row { display: flex; align-items: stretch; gap: 2px; }
    #menu .save-row .save-pick { flex: 1; min-width: 0; }
    #menu .save-row .save-pick.active { color: var(--green); font-weight: 700; }
    #menu .save-row .save-del {
      flex: 0 0 auto; color: var(--danger-ink); padding: 6px 8px;
    }
    /* Safety / sensor-permission splash shown on every load. The button
       click is the genuine user gesture we need to satisfy iOS's
       DeviceOrientationEvent.requestPermission() AND start GPS. */
    #safety, #locating {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.78);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #safety .box, #locating .box {
      max-width: 320px; background: #1a1612; color: #fff;
      border: 2px solid var(--gold-dark); border-radius: 12px;
      padding: 22px 20px; text-align: center;
      font: 14px ui-monospace, monospace; line-height: 1.45;
    }
    #safety p, #locating p { margin: 0 0 18px; }
    #safety button, #locating button {
      background: var(--gold-dark); color: #1a1612; border: 0;
      padding: 12px 22px; border-radius: 8px;
      font: 700 15px ui-monospace, monospace; cursor: pointer;
    }
    /* "Skip" is a secondary action — don't dress it up like the CTA. */
    #locating button {
      background: transparent; color: var(--gold-dark);
      border: 1px solid #6b5a2c; font-weight: 400; padding: 8px 18px;
    }
    /* First-load story intro — shown once, right after the safety splash,
       only when there is no prior intro flag (fresh save). Mirrors the
       safety box styling. */
    #story {
      position: fixed; inset: 0; z-index: 101;
      background: rgba(0, 0, 0, 0.82);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #story .box {
      max-width: 320px; background: #1a1612; color: #fff;
      border: 2px solid var(--gold-dark); border-radius: 12px;
      padding: 22px 20px; text-align: center;
      font: 15px ui-monospace, monospace; line-height: 1.5;
    }
    #story .art {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 10px; min-height: 150px; margin-bottom: 16px;
    }
    #story .art img {
      image-rendering: pixelated;
      height: 150px; width: auto;
    }
    #story .art.wrecks img { height: 120px; }
    #story p { margin: 0 0 18px; min-height: 3em; }
    #story button {
      background: var(--gold-dark); color: #1a1612; border: 0;
      padding: 12px 22px; border-radius: 8px;
      font: 700 15px ui-monospace, monospace; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="game">
      <div id="banner">reconnecting…</div>
      <div id="errbar">
        <div class="errmsg"></div>
        <div class="errstack"></div>
        <div class="errbtns">
          <button type="button" data-act="copy">Copy</button>
          <button type="button" data-act="dismiss">Dismiss</button>
        </div>
      </div>
    </div>
  </div>
  <!-- All HUD overlays live OUTSIDE #game so position:fixed actually anchors
       to the viewport — a position:fixed element inside a transformed parent
       (#game uses transform:scale) takes the transformed parent as its
       containing block, which would put it back inside #game's clipped zone.
       Same reason buildInventoryDOM appends to <body>. -->
  <div id="money">$0</div>
  <div id="energy">
    <span id="energy-label">⚡100/100</span>
    <div id="energy-bar"><div id="energy-bar-fill"></div></div>
  </div>
  <details id="menu">
    <summary>☰</summary>
    <div class="items">
      <button id="delivery-list">Deliveries</button>
      <button id="stats-relics">Stats &amp; Relics</button>
      <button id="move-home">Move Home here</button>
      <button id="debug-controls">Free walking (debug): off</button>
      <button id="debug-road-geom">Road geometry: on</button>
      <button id="debug-clear-relics">Remove all relics</button>
      <button id="debug-wood-relics">All wood relics (T1)</button>
      <button id="debug-dump-tile">Dump tile (debug)</button>
      <div id="saves-section" style="border-top:1px solid #333;margin-top:2px;padding-top:4px;">
        <div style="font:700 10px ui-monospace,monospace;color:#888;padding:2px 8px 4px;">Saved games</div>
        <div id="saves-list"><!-- one row per slot, injected from the save registry --></div>
        <button id="new-save">+ New game</button>
      </div>
      <div id="teleport-section" style="border-top:1px solid #333;margin-top:2px;padding-top:4px;">
        <div style="font:700 10px ui-monospace,monospace;color:#888;padding:2px 8px 4px;">Teleport</div>
        <!-- buttons injected from window.TELEPORT_PRESETS -->
      </div>
      <button class="danger" id="reset-save" style="border-top:1px solid #333;margin-top:2px;padding-top:8px;">Reset this game</button>
    </div>
  </details>
  <div id="hud"></div>
  <div id="safety">
    <div class="box">
      <h2 style="margin:0 0 12px;font:700 18px ui-monospace,monospace;color:var(--gold);">Welcome to Pocket Acres</h2>
      <p style="margin:0 0 12px;font:700 15px ui-monospace,monospace;color:var(--green);">Farm your neighbourhood.</p>
      <p><strong style="color:#ff8c3b;">Warning:</strong> Watch where you are going and do not enter unsafe or prohibited areas while playing!</p>
      <button id="safety-dismiss">Go to my location</button>
    </div>
  </div>
  <!-- Shown on a brand-new save while the very first GPS fix is being
       waited for. The world's projection origin is frozen at that fix, so the
       game boots once, already anchored at the player's home — see the boot
       gate at the bottom of this file. -->
  <div id="locating" style="display:none">
    <div class="box">
      <p style="margin:0 0 6px;font:700 15px ui-monospace,monospace;color:var(--gold);">Finding your location…</p>
      <p style="font-size:13px;opacity:.85;">Your farm is built around where you are right now.</p>
      <button id="locating-skip">Skip</button>
    </div>
  </div>
  <div id="story" style="display:none">
    <div class="box">
      <div class="art" id="story-art"></div>
      <p id="story-text"></p>
      <button id="story-next">Next</button>
    </div>
  </div>
  <script>
    // Fit the fixed 352×844 game box into the viewport using CSS scale.
    //
    // Portrait (real phone): scale by WIDTH so the map fills edge-to-edge
    // horizontally. The HUD overlays (money / energy / inventory bar / menu)
    // are position:fixed and stay pinned to the visual viewport.
    //
    // Landscape (desktop preview): scale by HEIGHT so the whole 352×844 game
    // (canvas + HUD chrome) fits the browser height as a phone-shaped narrow
    // column, centred horizontally. The two gutters on either side of the
    // column are exposed as CSS variables --phone-left / --phone-right so
    // every position:fixed HUD (declared either in <style> or via inline
    // styles in app.js — joystick, inv bar, relic row, etc.) can anchor
    // itself inside the column rather than stretching across the full
    // browser width. body.phone-preview also paints a thin frame around
    // the column for clarity.
    function fitGame() {
      const W = 352, H = 844;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const portrait = vw < vh;
      const g = document.getElementById('game');
      if (!g) return;
      const root = document.documentElement;
      if (portrait) {
        const s = vw / W;
        g.style.transform = `scale(${s})`;
        g.style.left = '0px';
        g.style.top  = '0px';
        document.body.classList.remove('phone-preview');
        root.style.setProperty('--phone-left',  '0px');
        root.style.setProperty('--phone-right', '0px');
      } else {
        // Desktop emulation: pin the simulated column to phone-sized widths
        // (390..430 CSS px — iPhone regular ↔ Pro Max) so HUD overlays sized
        // for a real phone don't cramp on short laptop windows. Tall windows
        // also clamp to ≤430 so the column doesn't grow unrealistically big.
        // #frame's overflow:hidden quietly clips the bottom if the column
        // exceeds vh.
        const PHONE_MIN = 390, PHONE_MAX = 430;
        const sByHeight = vh / H;
        const sByMaxW   = PHONE_MAX / W;
        const sByMinW   = PHONE_MIN / W;
        const s = Math.max(sByMinW, Math.min(sByHeight, sByMaxW));
        const phoneW = W * s;
        const scaledH = H * s;
        const left = Math.max(0, (vw - phoneW) / 2);
        const right = Math.max(0, vw - left - phoneW);
        // Vertically centre the game inside the column. When the column is
        // shorter than the scaled game (short laptop windows + the PHONE_MIN
        // clamp above), top goes negative so the game's MIDDLE sits at the
        // viewport's middle — otherwise the player view (rendered at
        // canvas-centre ≈ 422) ends up below the visible area and the map
        // disappears off the bottom.
        const top = Math.min(0, (vh - scaledH) / 2);
        // #frame is already left/right-inset by var(--phone-*), so #game sits
        // at left:0 inside #frame — setting g.style.left = left would double
        // the offset and push the game off-centre to the right.
        g.style.transform = `scale(${s})`;
        g.style.left = '0px';
        g.style.top  = top + 'px';
        document.body.classList.add('phone-preview');
        root.style.setProperty('--phone-left',  left  + 'px');
        root.style.setProperty('--phone-right', right + 'px');
      }
    }
    window.addEventListener('resize', fitGame);
    window.addEventListener('orientationchange', fitGame);
    window.visualViewport?.addEventListener('resize', fitGame);
    fitGame();

    // Block every zoom gesture the game box can't absorb. The whole UI is a
    // fixed 352×844 column scaled by fitGame; any browser/OS zoom layered on
    // top just shifts the fixed HUD overlays out of place. The viewport meta
    // (maximum-scale=1, user-scalable=no) covers most browsers, but iOS Safari
    // ignores it for pinch and fires gesture events instead, and desktop
    // ctrl/⌘+wheel and the ctrl/⌘ +/-/0 shortcuts bypass it entirely.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
      document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false });
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
        e.preventDefault();
      }
    });
    // Block iOS Safari's double-tap-to-zoom. This is the one zoom path the
    // rules above miss: it's NOT a gesture event (so the gesturestart guard
    // never sees it) and `touch-action:none` on <body> doesn't inherit to the
    // canvas/HUD where taps actually land. Impatient double-taps during normal
    // play (tapping an animal, mining) then zoom the page in — and because the
    // gesturestart guard simultaneously blocks pinch, the natural pinch-OUT
    // recovery is gone, leaving the player stuck zoomed in at max with no way
    // back. Suppressing the second tap of a quick pair closes that trap. We
    // only preventDefault on the close-together second touchend, so single
    // taps (and the game's own pointer handling) are untouched.
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    // Belt-and-suspenders: kill any synthesized double-click that slips past
    // the touchend guard (e.g. trackpad double-tap), which also triggers
    // browser zoom-to-block on some engines.
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    // Close menu on outside click / world tap.
    document.addEventListener('pointerdown', (e) => {
      const m = document.getElementById('menu');
      if (m && m.open && !m.contains(e.target)) m.open = false;
    }, true);
    document.getElementById('delivery-list').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      if (window.__scene && window.__scene.openDeliveryMenu) window.__scene.openDeliveryMenu();
    });
    document.getElementById('stats-relics').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      if (window.__scene && window.__scene.showStatsModal) window.__scene.showStatsModal();
    });
    document.getElementById('move-home').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      if (window.__scene && window.__scene.confirmMoveHomeTrailer) window.__scene.confirmMoveHomeTrailer();
    });
    // Debug controls: makes stick walking cost no stamina. That's all it does
    // now — there's no second joystick any more. The button label tracks state
    // both before the scene loads (read save directly) and after each click
    // (scene returns the new value).
    // Resolve the ACTIVE saved game's raw data straight from localStorage.
    // This runs at parse time, before save.js loads, so it can't use the save.js
    // helpers — it reads the slot registry inline, falling back to the legacy
    // single-save key for brand-new or pre-multislot players.
    function readActiveSaveRaw() {
      try {
        const reg = JSON.parse(localStorage.getItem('terracart.saves') || 'null');
        let key = 'terracart.save.v4';
        if (reg && Array.isArray(reg.slots) && reg.slots.length) {
          const slot = reg.slots.find(s => s.id === reg.active) || reg.slots[0];
          if (slot && slot.key) key = slot.key;
        }
        return JSON.parse(localStorage.getItem(key) || 'null');
      } catch { return null; }
    }
    const debugBtn = document.getElementById('debug-controls');
    function setDebugBtnLabel(on) {
      debugBtn.textContent = 'Free walking (debug): ' + (on ? 'on' : 'off');
    }
    try {
      const s = readActiveSaveRaw();
      setDebugBtnLabel(!!(s && s.debugControls));
    } catch { /* leave default 'off' */ }
    debugBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      const scene = window.__scene;
      if (!scene || !scene.setDebugControls) return;
      const next = !scene.save?.debugControls;
      setDebugBtnLabel(scene.setDebugControls(next));
    });
    // Road-geometry overlay: draws the ORIGINAL OSM road linework (the vector
    // ways the tile rasterizer turned into road cells) over the map in black
    // at 30% opacity. On by default; the save only ever stores an explicit off.
    const roadGeomBtn = document.getElementById('debug-road-geom');
    function setRoadGeomBtnLabel(on) {
      roadGeomBtn.textContent = 'Road geometry: ' + (on ? 'on' : 'off');
    }
    try {
      const s = readActiveSaveRaw();
      setRoadGeomBtnLabel(!(s && s.roadGeomOverlay === false));
    } catch { /* leave default 'on' */ }
    roadGeomBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      const scene = window.__scene;
      if (!scene || !scene.setRoadGeomOverlay) return;
      const next = scene.save?.roadGeomOverlay === false;
      setRoadGeomBtnLabel(scene.setRoadGeomOverlay(next));
    });
    document.getElementById('debug-clear-relics').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      const scene = window.__scene;
      if (!scene) return;
      scene.save.relics = scene.save.relics || {};
      for (const slot of Object.keys(scene.save.relics)) scene.save.relics[slot] = null;
      scene.markRelicsDirty?.();
      scene.updateRelicRow?.();
      scene.buildInventoryDOM?.();
      if (typeof persistSave === 'function') persistSave(scene.save);
    });
    document.getElementById('debug-dump-tile').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      const scene = window.__scene;
      if (scene && scene.dumpTileDebug) scene.dumpTileDebug();
      else if (window.showError) window.showError('tile debug unavailable', 'scene not ready');
    });
    document.getElementById('debug-wood-relics').addEventListener('click', (e) => {
      e.stopPropagation();
      const m = document.getElementById('menu'); if (m) m.open = false;
      const scene = window.__scene;
      if (!scene) return;
      scene.save.relics = scene.save.relics || {};
      const slots = (typeof RELIC_DEFS !== 'undefined') ? Object.keys(RELIC_DEFS) : [];
      for (const slot of slots) scene.save.relics[slot] = { tier: 1 };
      scene.markRelicsDirty?.();
      scene.updateRelicRow?.();
      scene.buildInventoryDOM?.();
      if (typeof persistSave === 'function') persistSave(scene.save);
    });
    // Teleport presets — relocate the world origin to a well-mapped suburb to
    // show off OSM features. A preset writes localStorage and reloads so the
    // whole projection re-initializes for the new latitude (player position is
    // never persisted — see save.js — so a reload cleanly re-centres). The
    // active preset is marked with a check; Home clears the override.
    function buildTeleportMenu() {
      const TP_KEY = 'terracart.teleport';
      const sec = document.getElementById('teleport-section');
      const presets = window.TELEPORT_PRESETS;
      if (!sec || !presets) return;   // app.js not loaded yet → skip silently
      let active = null;
      try { active = JSON.parse(localStorage.getItem(TP_KEY) || 'null'); } catch {}
      const activeName = active && active.name;
      for (const key of Object.keys(presets)) {
        const p = presets[key];
        const isHome = key === 'home';
        const isActive = isHome ? !activeName : (activeName === p.name);
        const btn = document.createElement('button');
        btn.textContent = (isActive ? '✓ ' : '') + p.name;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          try {
            if (isHome) localStorage.removeItem(TP_KEY);
            else localStorage.setItem(TP_KEY, JSON.stringify({ name: p.name, lat: p.lat, lon: p.lon }));
          } catch {}
          location.reload();
        });
        sec.appendChild(btn);
      }
    }
    // app.js defines window.TELEPORT_PRESETS. It normally loads before
    // DOMContentLoaded, but the boot gate at the bottom of this file can hold
    // it back until the first GPS fix — so build now AND again once app.js
    // has actually loaded (the builder is a no-op until the presets exist).
    window.__buildTeleportMenu = () => buildTeleportMenu();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', buildTeleportMenu);
    } else {
      buildTeleportMenu();
    }

    // ── Saved games ─────────────────────────────────────────────────
    // One row per save slot (from the save.js registry): a name button that
    // switches to (loads) that game, plus a ✕ to delete it. A "+ New game"
    // button creates a fresh slot. Switching / creating just repoints the
    // active-slot pointer and reloads — the scene + all in-memory caches
    // re-init from the chosen slot on the next load. Built (and rebuilt) from
    // listSaves(); save.js has loaded by DOMContentLoaded.
    function buildSavesMenu() {
      const listEl = document.getElementById('saves-list');
      if (!listEl || typeof listSaves !== 'function') return;  // save.js not ready → skip
      listEl.innerHTML = '';
      const saves = listSaves();
      for (const s of saves) {
        const row = document.createElement('div');
        row.className = 'save-row';
        const pick = document.createElement('button');
        pick.className = 'save-pick' + (s.active ? ' active' : '');
        pick.textContent = (s.active ? '✓ ' : '') + s.name;
        pick.title = s.name;
        pick.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (s.active) { const m = document.getElementById('menu'); if (m) m.open = false; return; }
          // Persist any pending writes to the OUTGOING slot before we switch.
          if (typeof flushSave === 'function') flushSave();
          if (typeof switchSave === 'function') switchSave(s.id);
          // Then kill the save pipeline. switchSave repoints SAVE_KEY at the
          // INCOMING slot, but the scene is still running and still holding the
          // outgoing game in memory — any persistSave it makes between here and
          // the reload (movement, energy tick), or the pagehide flush the reload
          // itself fires, would write that game onto the slot we're switching
          // TO. Same hazard the reset handler guards against below.
          if (typeof disableSave === 'function') disableSave();
          location.reload();
        });
        row.appendChild(pick);
        // Don't offer to delete the only remaining game — there's always one.
        if (saves.length > 1) {
          const del = document.createElement('button');
          del.className = 'save-del';
          del.textContent = '✕';
          del.title = 'Delete ' + s.name;
          del.addEventListener('click', (ev) => {
            ev.stopPropagation();
            if (!confirm('Delete saved game "' + s.name + '"? This cannot be undone.')) return;
            const wasActive = s.active;
            if (typeof deleteSave === 'function') deleteSave(s.id);
            if (wasActive) {
              // Deleting the active slot repoints SAVE_KEY at a surviving game;
              // freeze writes so the deleted game's in-memory state can't be
              // flushed on top of it before the reload.
              if (typeof disableSave === 'function') disableSave();
              location.reload();   // active slot changed → reboot scene
            }
            else buildSavesMenu();            // just refresh the list
          });
          row.appendChild(del);
        }
        listEl.appendChild(row);
      }
      const newBtn = document.getElementById('new-save');
      if (newBtn && !newBtn._wired) {
        newBtn._wired = true;
        newBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const name = prompt('Name your new game:', 'Game ' + (listSaves().length + 1));
          if (name === null) return;   // cancelled
          if (typeof flushSave === 'function') flushSave();
          if (typeof createSave === 'function') createSave(name);
          // createSave points SAVE_KEY at the new, EMPTY slot — but the scene is
          // still running with the old game in memory. Without freezing writes
          // here, its next persistSave (or the pagehide flush that
          // location.reload fires) lands the old game's inventory, money and
          // progress in the brand-new slot, so "New game" started you off with
          // everything you already had.
          if (typeof disableSave === 'function') disableSave();
          location.reload();
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', buildSavesMenu);
    } else {
      buildSavesMenu();
    }
    // Safety splash dismiss → also our sensor-permission gesture. iOS
    // requires DeviceOrientationEvent.requestPermission() to be called
    // synchronously from within a user-gesture handler — so we do it
    // here, inline in the click. The promise resolution can be async; the
    // call itself just has to originate inside the click stack.
    let __safetyDismissed = false;
    // Set once the player has agreed to share their location (the safety CTA,
    // or an earlier answer carried across a reload in the same session). The
    // boot gate polls this via window.__locationConsented.
    let __consented = false;
    window.__locationConsented = () => __consented;
    // On a GPS-triggered location.reload() (new save home capture), sessionStorage
    // persists across the reload. Auto-dismiss the safety splash so it doesn't
    // appear a second time — the user already acknowledged it this session.
    try {
      if (sessionStorage.getItem('terracart.safetySeen')) {
        __safetyDismissed = true;
        document.getElementById('safety')?.remove();
        window.__compassPerm = window.__compassPerm || 'granted';
        // Consent was given earlier this session — the boot gate (below) may
        // still be waiting for it, and no CTA is left to click.
        __consented = true;
      }
    } catch {}
    document.getElementById('safety-dismiss')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      // Guard against the handler running twice. On iOS the permission prompt
      // below is awaited BEFORE the splash is removed, so a second tap (or a
      // synthesized re-fire) could re-enter and play the opening story twice.
      if (__safetyDismissed) return;
      __safetyDismissed = true;
      __consented = true;
      try { sessionStorage.setItem('terracart.safetySeen', '1'); } catch {}
      // Remove the splash up front so a queued second tap can't land on it again
      // while we're awaiting the permission prompt.
      document.getElementById('safety')?.remove();
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === 'function') {
        try {
          window.__compassPerm = await DOE.requestPermission();   // 'granted' | 'denied'
        } catch (err) {
          window.__compassPerm = 'error';
        }
      } else {
        window.__compassPerm = 'granted';  // Android / desktop: no prompt needed
      }
      // Start sensors now if the scene already finished loading; otherwise
      // the scene's create() will see window.__compassPerm and start them.
      // On a brand-new save the scene doesn't exist yet — the boot gate is
      // holding app.js back until the first fix; this is its go signal.
      window.__onLocationConsent?.();
      window.__scene?.startSensors?.();
    });
    // Two-slide opening story shown once after the safety splash. Slide 1
    // is the player's trailer ("You wake up…"), slide 2 is the wrecked
    // neighbourhood ("…time to rebuild!"). Pure DOM overlay — the game runs
    // underneath; clicking through it just hides the overlay.
    const STORY_SLIDES = [
      {
        art: '<img src="assets/Objects/Houses/trailer.png" alt="">',
        wrecks: false,
        text: 'You wake up in your trailer…',
        btn: 'Next',
      },
      {
        art: '<img src="assets/Objects/Houses/Wreck.png" alt="">'
           + '<img src="assets/Objects/Houses/Wreck.png" alt="">'
           + '<img src="assets/Objects/Houses/Wreck.png" alt="">',
        wrecks: true,
        text: '…to see the remains of your neighbourhood. Time to rebuild!',
        btn: "Let's go",
      },
    ];
    let __storyStarted = false;
    function startStory(onDone) {
      // Idempotent: never show the opening story more than once per page load,
      // even if something calls this twice (the overlay is removed on finish,
      // so a later call would no-op anyway — this just makes it explicit).
      if (__storyStarted) return;
      const overlay = document.getElementById('story');
      const artEl = document.getElementById('story-art');
      const textEl = document.getElementById('story-text');
      const btn = document.getElementById('story-next');
      if (!overlay || !artEl || !textEl || !btn) return;
      __storyStarted = true;
      let i = 0;
      const render = () => {
        const s = STORY_SLIDES[i];
        artEl.className = 'art' + (s.wrecks ? ' wrecks' : '');
        artEl.innerHTML = s.art;
        textEl.textContent = s.text;
        btn.textContent = s.btn;
      };
      const advance = () => {
        i++;
        if (i >= STORY_SLIDES.length) {
          try { localStorage.setItem('terracart.introSeen', '1'); } catch {}
          overlay.remove();
          onDone?.();
          return;
        }
        render();
      };
      btn.addEventListener('click', (ev) => { ev.stopPropagation(); advance(); });
      render();
      overlay.style.display = 'flex';
    }
    // Start-flow ordering. On a truly fresh start the opening story plays
    // FIRST, and the safety/"Go to my location" splash only appears after the
    // last slide — so the CTA never interrupts the story. And when startGps
    // captures the first fix on a brand-new save it reloads to re-anchor the
    // projection: that reload carries a one-shot sessionStorage flag (holding
    // the compass-permission answer) so the splash — answered seconds earlier
    // — is skipped instead of appearing a second time.
    let __skipSafetyPerm = null;
    try {
      __skipSafetyPerm = sessionStorage.getItem('terracart.skipSafety');
      if (__skipSafetyPerm) sessionStorage.removeItem('terracart.skipSafety');
    } catch { /* sessionStorage blocked — show the splash as usual */ }
    if (__skipSafetyPerm) {
      // Home-capture reload — the splash was answered just before it. iOS
      // compass permission persists for the browsing session, so reuse the
      // pre-reload answer. The scene's create() sees window.__compassPerm and
      // starts sensors itself; the direct call covers a scene that somehow
      // finished loading first.
      __safetyDismissed = true;
      document.getElementById('safety')?.remove();
      window.__compassPerm = __skipSafetyPerm;
      __consented = true;
      window.__onLocationConsent?.();
      window.__scene?.startSensors?.();
    } else {
      let freshIntro = false;
      try { freshIntro = !localStorage.getItem('terracart.introSeen'); } catch {}
      if (freshIntro) {
        const safetyEl = document.getElementById('safety');
        if (safetyEl) safetyEl.style.display = 'none';
        startStory(() => { if (safetyEl) safetyEl.style.display = 'flex'; });
      }
    }
    // Reset THIS game: wipe only the active save slot's progress, plus every
    // cache of map tiles and global runtime state, so the current game reboots
    // truly fresh. Other saved games are left untouched. The app shell / service
    // worker are deliberately NOT nuked here (this is a game reset, not an app
    // reinstall). Errors are swallowed individually so a missing caches / IDB
    // API never blocks the reload.
    document.getElementById('reset-save').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Reset THIS saved game and clear cached map tiles? Your other saved games are kept.')) return;
      // 0) Wipe the active slot + kill the save pipeline. Without disabling
      //    writes, the scene's update loop (or the pagehide handler triggered by
      //    location.reload below) flushes the in-memory _pendingSave back to
      //    localStorage AFTER we wipe it — silently restoring the old save.
      if (typeof resetCurrentSave === 'function') resetCurrentSave();
      else if (typeof disableSave === 'function') disableSave();
      // 1) Global runtime state: replay the intro on the fresh game.
      try { localStorage.removeItem('terracart.introSeen'); } catch {}
      // 2) Map-tile caches. Two layers persist tiles across loads:
      //    a) Cache API tile bucket(s) populated by the service worker, and
      //    b) the worldgen IndexedDB ('mapgame-tiles') of raw tile bytes.
      //    In-memory worldgen caches reset on reload, so the load below is clean.
      try {
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter(k => /tile/i.test(k))
            .map(k => caches.delete(k).catch(() => {})));
        }
      } catch {}
      try { indexedDB.deleteDatabase('mapgame-tiles'); } catch {}
      location.reload();
    });

    // ───────────────────────────────────────────────────────────────
    // Mobile error surfacing — DevTools isn't reachable on phones, so any
    // uncaught JS error is shown in a copyable overlay (#errbar) instead of a
    // truncated flash. The FULL message + stack stay on screen until dismissed
    // so they can actually be read and copied (Copy button → clipboard).
    const errbar     = document.getElementById('errbar');
    const errMsgEl   = errbar && errbar.querySelector('.errmsg');
    const errStackEl = errbar && errbar.querySelector('.errstack');
    let errFullText  = '';
    function showError(msg, detail) {
      if (!errbar) return;
      errMsgEl.textContent = msg || 'error';
      errStackEl.textContent = detail || '';
      errStackEl.style.display = detail ? 'block' : 'none';
      errFullText = detail ? `${msg}\n\n${detail}` : (msg || '');
      errbar.style.display = 'block';
      errbar.scrollTop = 0;
    }
    // Expose so the in-game loop-error handler (app.js) can route through the
    // same copyable overlay instead of writing a truncated #banner string.
    window.showError = showError;
    if (errbar) {
      errbar.addEventListener('click', async (ev) => {
        const act = ev.target && ev.target.dataset && ev.target.dataset.act;
        if (act === 'dismiss') { errbar.style.display = 'none'; return; }
        if (act !== 'copy') return;
        const btn = ev.target, old = btn.textContent;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(errFullText);
          } else {
            // Fallback for non-secure contexts (clipboard API needs HTTPS):
            // select the overlay contents and use execCommand.
            const range = document.createRange();
            range.selectNodeContents(errbar);
            const sel = getSelection();
            sel.removeAllRanges(); sel.addRange(range);
            document.execCommand('copy');
            sel.removeAllRanges();
          }
          btn.textContent = 'Copied!';
        } catch (_) {
          btn.textContent = 'Copy failed';
        }
        setTimeout(() => { btn.textContent = old; }, 1400);
      });
    }
    window.addEventListener('error', (e) => {
      const err = e.error;
      const msg = (err && err.message) || e.message || 'script error';
      const stack = (err && err.stack)
        || (e.filename ? `${e.filename}:${e.lineno}:${e.colno}` : '');
      showError(`⚠ ${msg}`, stack);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e.reason;
      const msg = (r && (r.message || r.toString())) || 'promise rejection';
      const stack = (r && r.stack) || '';
      showError(`⚠ ${msg}`, stack);
    });

    // ───────────────────────────────────────────────────────────────
    // Service worker — caches MVT tiles + the app shell so the game
    // works offline once a region has been visited, and reloads are
    // fast on cellular. Only registered when the page is served over
    // http(s) (file:// has no SW support).
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>

  <script>
    // ─── Boot gate ────────────────────────────────────────────────────────
    // app.js freezes the world's projection origin at parse time (START_LAT /
    // START_LON, read from save.home), so on a brand-new save that origin
    // isn't knowable until the first GPS fix arrives. The app used to boot at
    // the default origin, capture the fix, then location.reload() to re-anchor
    // — and that reload cost the player a SECOND browser location prompt
    // (a reload re-asks whenever the grant isn't persistent, e.g. Safari's
    // "Allow Once"). So: on a fresh save, hold app.js back until the fix
    // lands, write save.home, then boot ONCE, already anchored at home.
    // Everything else (a save that already has a home, a teleport override,
    // sandbox, the test harness) boots immediately, exactly as before.
    //
    // The fix comes from the shared Geo watcher, so the scene's own GPS
    // tracking joins that same watch — one watchPosition per page, one prompt.
    (function () {
      const APP_SRC = 'src/app.js?v=374';
      // How long the gate waits for that first fix before giving up and
      // booting at the default origin. A cold GPS start can take far longer
      // than this indoors, so app.js keeps its capture-then-reload path as a
      // fallback for a fix that lands after we've booted.
      const GATE_MS = 15000;

      let booted = false;
      function bootApp() {
        if (booted) return;
        booted = true;
        document.getElementById('locating')?.remove();
        const el = document.createElement('script');
        el.src = APP_SRC;
        // app.js defines window.TELEPORT_PRESETS; the ☰ menu's teleport
        // section was built before it loaded, so build it again now.
        el.onload = () => { try { window.__buildTeleportMenu?.(); } catch (_) {} };
        document.body.appendChild(el);
      }

      // Does this load need to capture a home origin? Mirrors the
      // _homeCapturePending conditions in app.js create().
      function needsHomeCapture() {
        if (window.__TEST_MODE) return false;
        if (typeof navigator === 'undefined' || !navigator.geolocation) return false;
        // A teleport preset relocates the origin explicitly — no capture.
        try {
          const tp = JSON.parse(localStorage.getItem('terracart.teleport') || 'null');
          if (tp && Number.isFinite(tp.lat) && Number.isFinite(tp.lon)) return false;
        } catch (_) { /* malformed override → ignore */ }
        if (typeof Sandbox !== 'undefined' && Sandbox.detect()) return false;
        try {
          if (typeof initSaves === 'function') initSaves();
          const sv = (typeof loadSave === 'function') ? loadSave() : null;
          if (!sv) return false;
          // Already anchored, or already placed the starter home: a save that
          // has put objects in the world can't have its origin moved.
          if (sv.home || sv.starterShopId) return false;
        } catch (_) { return false; }
        return true;
      }

      if (!needsHomeCapture()) { bootApp(); return; }

      let sub = null;
      let timer = null;
      function done() {
        if (timer) { clearTimeout(timer); timer = null; }
        if (sub) { Geo.unsubscribe(sub); sub = null; }
        bootApp();
      }

      // Called from the safety splash's "Go to my location" button — the
      // player's consent, and the only point at which we touch geolocation.
      window.__onLocationConsent = function () {
        if (booted || sub) return;
        const box = document.getElementById('locating');
        if (box) box.style.display = 'flex';
        sub = Geo.subscribe(
          pos => {
            const { latitude, longitude } = pos.coords;
            try {
              const sv = loadSave();
              sv.home = { lat: latitude, lon: longitude };
              persistSave(sv);
              flushSave();     // app.js reads the save synchronously as it parses
            } catch (_) { /* write failed → app.js's fallback capture retries */ }
            done();
          },
          err => {
            // Denied outright: no GPS this save, boot at the default origin.
            // TIMEOUT / POSITION_UNAVAILABLE are transient — keep waiting
            // until the gate's own deadline.
            if (err && err.code === 1) done();
          }
        );
        if (!sub) { done(); return; }   // geolocation unavailable after all
        timer = setTimeout(done, GATE_MS);
      };
      document.getElementById('locating-skip')?.addEventListener('click', (ev) => {
        ev.stopPropagation();
        done();
      });
      // Consent may already have been given before this script ran (the splash
      // is auto-dismissed on a same-session reload).
      if (window.__locationConsented?.()) window.__onLocationConsent();
    })();
  </script>
