<!doctype html>
<!--
  Polygonal building footprints — standalone preview.

  building_overlay.js draws the SOURCE OSM building rings instead of the cells
  the rasterizer squared them onto (see the header of src/building_overlay.js).
  The headless suite pins its maths against a recording stub, which is the
  right test but shows you nothing; the game itself needs live map tiles. This
  page is the middle ground: a hand-written fixture of detailed concave footprints
  with selectable roof slopes — fed to
  the REAL canvas adapter through a Phaser-shaped shim thin enough to read in
  one screen (textures.createCanvas / add.image backed by DOM canvases).
  Everything you see is the module's own drawing code.

  Serve the repo (python -m http.server 7731) and open /tools/building-poly-preview.html.
  It is a preview, not a test: nothing here asserts, and the shim is only as
  faithful as the two methods it implements.
-->
<html lang="en"><head><meta charset="utf-8"><title>polygonal footprints preview</title><style>
body{margin:0;background:#4b7f4b;}
#stage{position:relative;width:960px;height:760px;overflow:hidden;}
canvas{position:absolute;image-rendering:pixelated;}
</style></head><body>
<div style="padding:18px 28px;color:#fff0cb;font:16px system-ui">
<b>Building material + roof study</b> &nbsp;
<select id="roof"><option value="ridge">Slopes meeting at ridges</option><option value="inset">Inset flat roof + steep skirt</option><option value="shallow">Inset flat roof + shallow skirt</option></select>
<select id="detail"><option value="clean">Simplified roof</option><option value="detailed">Previous dense roof</option></select>
<select id="stories"><option value="1">1 storey</option><option value="2">2 storeys</option><option value="3">3 storeys</option><option value="0">Shop defaults</option></select>
<div style="margin-top:8px;font-size:13px">Same six outlines, including 4px bays, narrow wings and deep open courtyards. Existing game signs are unchanged.</div>
</div><div id="stage"></div>
<script src="game-loader.js"></script>
<script src="building-roof-fixtures.js"></script>
<script>
(async () => {
await loadGame();
const stage = document.getElementById('stage');
// Minimal Phaser-shaped shim: enough of textures/add.image for the overlay's
// real canvas adapter to run, backed by DOM canvases.
const scene = {
  startWorldM: { x: 32 * 7, y: 32 * 7 }, playerM: { x: 0, y: 0 },
  mPerPx: 10, originPx: { x: 0, y: 0 }, cellM: 7, cellsPerTile: 64, depth: 0, save: {},
  viewCenterX: 480, viewCenterY: 480, viewLeft: 0, viewTop: 0, viewSize: 960,
  isClaimedKey: (k) => k !== 'unclaimed',
  textures: {
    _m: new Map(),
    exists(k) { return this._m.has(k); },
    remove(k) { this._m.delete(k); },
    get(k) { return this._m.get(k); },
    createCanvas(k, w, h) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const t = { canvas: c, getContext: () => c.getContext('2d'), add() {}, refresh() {}, getSourceImage: () => c };
      this._m.set(k, t); return t;
    },
  },
  add: {
    image(x, y, key) {
      const t = scene.textures.get(key);
      t.canvas.style.left = x + 'px'; t.canvas.style.top = y + 'px';
      stage.appendChild(t.canvas);
      return { setOrigin() { return this; }, setAlpha() { return this; } };
    },
  },
  buildingGeomContainer: { add() {}, setVisible() {}, setPosition() {} },
  playerToWorldCell: () => ({ tx: 0, ty: 0, cx: 32, cy: 32 }),
};
// Bake the real biome textures so the floors wear their materials.
if (typeof makeBiomeTextures === 'function') {
  // textures.js draws into Phaser canvas textures; give it ours.
  makeBiomeTextures(scene, CELL_PX);
}
const TILE_EDGE_M = 64 * 7;
const M = (cx, cy) => [cx * 7, cy * 7];
const ring = (pts) => Float32Array.from(pts.flatMap(([x, y]) => M(x, y)));
const rot = (cx, cy, w, h, a) => {
  const c = Math.cos(a), s = Math.sin(a);
  return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y]) => [cx + x*c - y*s, cy + x*s + y*c]);
};
const params=new URLSearchParams(location.search);
scene.buildingRoofVariant = params.get('roof') || 'ridge';
scene.buildingRoofDetail=params.get('detail') || 'clean';
scene.buildingStoreys=Number(params.get('stories') || 2);
for(const [id,field] of [['detail','buildingRoofDetail'],['stories','buildingStoreys']]) {
  document.getElementById(id).value=scene[field];
  document.getElementById(id).onchange=e=>{scene[field]=id==='stories'?Number(e.target.value):e.target.value;BuildingOverlay.draw(scene);};
}
document.getElementById('roof').value=scene.buildingRoofVariant;
document.getElementById('roof').onchange=e=>{scene.buildingRoofVariant=e.target.value;BuildingOverlay.draw(scene);};
scene.save.restoredHouses = {};
scene.save.shopLines={};
const roles=['plain','blacksmith','supply','trader','relic','potion'];
const labels=['House · lime plaster','Blacksmith · soot brick','Supply · timber','Trader · sandstone','Relic · cut stone','Magic · tinted plaster'];
const fixtures = BuildingRoofFixtures.map((fixture, i) => {
  const x=55+(i%3)*310, y=115+Math.floor(i/3)*350, key='roof-'+i;
  const scale=1.25;
  const role=roles[i],shop=['supply','relic','potion'].includes(role);
  scene.save.restoredHouses[key] = shop?'shop':role;
  if(shop)scene.save.shopLines[key]=role;
  const label=document.createElement('div'); label.textContent=labels[i]+' — '+fixture.name;
  Object.assign(label.style,{position:'absolute',left:(x-15)+'px',top:(y+220)+'px',
    width:'270px',textAlign:'center',color:'#fff0cb',font:'bold 14px system-ui',zIndex:2});
  stage.appendChild(label);
  return {ring:Float32Array.from(fixture.points.flatMap(([px,py])=>
    [224+(x+px*scale-496)*7/32,224+(y+py*scale-496)*7/32])),tier:9,areaM2:200,key};
});
WorldGen.tileCache.set(WorldGen.tileKey(0, 0), {
  tileEdgeM: TILE_EDGE_M, buildingShapes: fixtures,
  objects: fixtures.map(f => ({kind:'house',id:f.key,tier:9})),
});
// The GROUND the footprints stand on, drawn the way the game's ground layers
// draw it: a flat biome fill, the per-cell procedural texture over it, then
// render.js's dashed cell grid (its own GRID_LINE, so this page can't invent a
// different lattice than the one the overlay continues). Without it there is
// nothing for a footprint to sit on and no way to judge whether the ground's
// squares still read across one.
(function ground() {
  const c = document.createElement('canvas');
  c.width = c.height = 960; c.style.left = '0px'; c.style.top = '0px';
  stage.insertBefore(c, stage.firstChild);
  const x = c.getContext('2d');
  x.fillStyle = '#479757'; x.fillRect(0, 0, 960, 960);
  const tex = scene.textures.get('biome0_0');
  for (let r = -1; r <= 32; r++) {
    for (let col = -1; col <= 32; col++) {
      const t = scene.textures.get(`biome0_${(col * 7 + r * 13) & 1}`);
      if (t) x.drawImage(t.canvas, col * CELL_PX, r * CELL_PX, CELL_PX, CELL_PX);
    }
  }
  const G = Render.GRID_LINE;
  x.strokeStyle = `rgba(0,0,0,${G.alpha})`;
  x.lineWidth = G.width;
  x.setLineDash([G.dash, G.gap]);
  x.beginPath();
  for (let i = -1; i <= 32; i++) {
    const p = Math.round(i * CELL_PX + CELL_PX / 2);
    x.moveTo(p, 0); x.lineTo(p, 960);
    x.moveTo(0, p); x.lineTo(960, p);
  }
  x.stroke();
})();
window.previewScene = scene;
BuildingOverlay.draw(scene);
document.title = 'ready';
})().catch((error) => {
  document.title = 'preview failed';
  document.getElementById('stage').textContent = error.message;
  console.error(error);
});
</script></body></html>
