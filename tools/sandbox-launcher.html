<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Load planning scenario</title>
<style>body{font:16px/1.5 system-ui;background:#141b20;color:#edf3ee;max-width:700px;margin:80px auto;padding:24px}a{color:#b7ddcf}</style>
<h1>Loading sandbox</h1><p id="status" role="status">Preparing the selected layout…</p><p><a id="back" href="http://localhost:8765/zone-variants/#ambient-layouts">Back to floor plans</a></p>
<script src="game-loader.js"></script><script>
(async () => {
  const status = document.getElementById('status');
  try {
    const raw = new URLSearchParams(location.hash.slice(1)).get('scenario');
    if (!raw || raw.length > 3000000) throw new Error('Choose Load in sandbox on a planning variant.');
    const scenario = JSON.parse(raw);
    await loadGame();
    FloorSandbox.writeScenario(scenario);
    if (scenario.returnUrl) document.getElementById('back').href = FloorSandbox.read().returnUrl;
    // Store on the game origin, just as the floor viewer does; the artifact
    // page can live on a different port without sharing browser storage.
    location.replace('../index.html?sandbox=true&sandboxMap=scenario&skipStory=true&skipTutorial=true');
  } catch (error) {
    status.textContent = 'Could not load scenario: ' + error.message;
  }
})();
</script></html>
