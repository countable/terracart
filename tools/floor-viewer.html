<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Hood - floor viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #14181a; color: #e8e4da;
    font: 14px/1.4 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 10px 16px; background: #1b2124e6; border-bottom: 1px solid #3a4146; z-index: 2; }
  #bar h1 { font-size: 14px; margin: 0 4px 0 0; letter-spacing: .04em; color: #9fb8a4; }
  .seg { display: flex; border: 1px solid #3a4146; border-radius: 7px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: #22292d; color: #cfc9bc; padding: 5px 11px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #3a4146; }
  .seg button.on { background: #4c6b4a; color: #fff; }
  .seg button.proposed.on { background: #7a5a3a; }
  .variant { display: flex; align-items: center; gap: 7px; }
  .variant button { font: inherit; width: 26px; height: 26px; border-radius: 6px; border: 1px solid #3a4146;
    background: #22292d; color: #cfc9bc; cursor: pointer; }
  .variant button:hover { border-color: #9fb8a4; }
  .variant button.on { background: #4c6b4a; color: #fff; }
  #variantName { min-width: 170px; color: #c9b98a; }
  label { color: #98a09a; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  #tag { position: fixed; top: 64px; left: 16px; z-index: 2; background: #1b2124d9; border: 1px solid #3a4146;
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: #cfc9bc; max-width: 320px; }
  #tag b { color: #9fb8a4; }
  #status { position: fixed; top: 64px; right: 16px; z-index: 2; background: #1b2124d9; border: 1px solid #3a4146;
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: #c9b98a; max-width: 300px; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style></head>
<body>
<div id="bar">
  <h1>FLOOR VIEWER</h1>
  <div><label>Floor</label><div class="seg" id="floorSeg"></div></div>
  <div><label>View</label><div class="seg" id="modeSeg">
    <button data-mode="current" class="on">Current code</button>
    <button data-mode="proposed" class="proposed">Proposed design</button>
  </div></div>
  <div class="variant"><div><label>Creatures</label></div><button id="creatureToggle" class="on" style="width:auto;padding:0 10px;">shown</button></div>
  <div class="variant"><div><label>Variant index</label></div>
    <button id="vMinus">&minus;</button><span id="variantName">0</span><button id="vPlus">+</button>
  </div>
</div>
<div id="tag"></div>
<div id="status">Loading game modules&hellip;</div>
<canvas id="cv"></canvas>
<script src="game-loader.js"></script>
<script src="floor-viewer-region.js"></script>
<script src="map-review-art.js"></script>
<script>
(() => {
  'use strict';
  const GROVE_AREAS = ['spring cave', 'goblin warrens', 'mushroom cavern', 'gemstone cavern'];
  const FLOOR_NAMES = { 0: 'Surface - the town', 1: 'Floor 1 - natural caves', 2: 'Floor 2 - deep stone (city design pending)',
    3: 'Floor 3 - the open Underdark (target: deep stone)', 4: 'Floor 4 - surface mirror (target: fungal Underdark)',
    5: 'Floor 5 - plain mirror + lava (target: the haunted dead city)', 6: 'Floor 6 - plain mirror (target: the lava stratum)',
    7: 'Floor 7 - plain mirror (target: dragon hunting grounds)', 8: 'Floor 8 - plain mirror (target: the roosts)' };
  let floor = 0, mode = 'current', variantIndex = 0, showCreatures = true;
  const entries = {};   // depth -> built tile entry (real pipeline)
  const sprites = {};   // depth -> [{o, appearance, fruit}]
  let assets = null, world = null;

  const status = t => document.getElementById('status').innerHTML = t;
  const tag = t => document.getElementById('tag').innerHTML = t;

  // ── Boot: load every game module, then build the region for real ─────────
  (async () => {
    await loadGame();
    const W = WorldGen, R = FloorViewerRegion;
    status('Building the surface&hellip;');
    const layers = R.makeLayers();
    const r = await W.runStepsSliced(() => W.rasterizeTileSteps(layers, R.N, 0, 0, R.EDGE));
    const entry = Object.assign({ tx: 0, ty: 0, cellsPerEdge: R.N, tileEdgeM: R.EDGE, layers,
      status: 'ready', depth: 0 }, r);
    entry.objects = r.objects.slice();
    await W.runStepsSliced(() => W.maybePlaceCaveEntranceSteps(entry, 0, 0, R.EDGE, r.objects, r.wildplants));
    entry.baseGrid = entry.grid.slice(); entry.genObjects = entry.objects.slice();
    W.stampPoiDensity(entry.objects);
    W.tileCache.set(W.tileKey(0, 0), entry);
    entries[0] = entry;

    const home = { x: R.EDGE / 2, y: R.EDGE / 2 };
    try { HomeArea.setOrigin(home.x, home.y); } catch (_) {}
    const scene = Object.create(MapScene.prototype);
    Object.assign(scene, { tileEdgeM: R.EDGE, depth: 0, save: {}, startWorldM: home,
      playerM: { x: home.x, y: home.y }, mPerPx: R.EDGE / W.TILE_PX,
      originPx: { x: home.x / (R.EDGE / W.TILE_PX), y: home.y / (R.EDGE / W.TILE_PX) },
      cellM: W.CELL_M, cellsForRow: () => R.N, cellsPerTile: R.N, cellPx: 32,
      feetOffsetM: 0, peekM: { x: 0, y: 0 }, _popEnergy() {}, _cropRaidable: [], flash() {}, flashLoot() {} });

    status('Dressing the surface&hellip;');
    try { await W.runStepsSliced(() => scene.spawnInTileSteps(entry, 0, 0)); } catch (e) { console.warn(e); }

    for (const d of [1, 2, 3, 4, 5, 6, 7, 8]) {
      status(`Building floor ${d}&hellip;`);
      W.setDepth(d);
      const e = await W.loadTile.atDepth(d, 0, 0, R.lat);
      if (e.promise) await e.promise;
      Object.assign(e, { tx: 0, ty: 0 });
      try { scene.spawnCaveCreatures(e, 0, 0, d); } catch (err) { console.warn(err); }
      entries[d] = e;
    }
    W.setDepth(0);
    status('Loading game art&hellip;');
    assets = await loadAssets();
    for (const d of [0, 1, 2, 3, 4, 5, 6, 7, 8]) sprites[d] = prepareSprites(entries[d], d);
    status('Ready - pick a floor.');
    draw();
  })().catch(e => status('Error: ' + e.message + ' (see console)'));

  // ── Assets: the shipped sheets on plain canvases (map-review's loader) ───
  let assetsPromise = null;
  function loadAssets() {
    if (assetsPromise) return assetsPromise;
    assetsPromise = (async () => {
      const entriesMap = new Map();
      const store = {
        exists: key => entriesMap.has(key), get: key => entriesMap.get(key),
        remove: key => entriesMap.delete(key),
        addImage(key, source) { return add(key, source); },
        addSpriteSheet(key, source, spec) { return add(key, source, spec); },
        createCanvas(key, w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return add(key, c); },
      };
      function add(key, source, spec) {
        const frames = new Map();
        const t = {
          getSourceImage: () => source, getContext: () => source.getContext('2d'), refresh() {},
          add(name, index, x, y, width, height) { frames.set(name, { x, y, width, height }); },
          get: name => frames.get(name ?? '__BASE') || frames.get(0) || frames.get('__BASE'),
        };
        t.add('__BASE', 0, 0, 0, source.width, source.height);
        if (spec) {
          let n = 0;
          for (let y = 0; y + spec.frameHeight <= source.height; y += spec.frameHeight)
            for (let x = 0; x + spec.frameWidth <= source.width; x += spec.frameWidth)
              t.add(n++, 0, x, y, spec.frameWidth, spec.frameHeight);
        }
        entriesMap.set(key, t); return t;
      }
      const scene = { textures: store };
      const failures = [];
      await Promise.all(Object.entries(ASSETS).map(async ([key, spec]) => {
        if (!['image', 'spritesheet'].includes(spec.kind)) return;
        try {
          const img = new Image(); img.src = '../' + spec.path; await img.decode();
          if (spec.kind === 'spritesheet') store.addSpriteSheet(key, img, spec); else store.addImage(key, img);
          if (spec.onLoad) spec.onLoad(scene);
        } catch (error) { failures.push(key); console.warn('asset', key, error); }
      }));
      try { makeTowerTexture(scene); makePotOfGoldTexture(scene); makeTrapTextures(scene); } catch (e) { console.warn(e); }
      try {
        for (const [type, spec] of Object.entries(BIOME_TEX)) for (let v = 0; v < spec.variants; v++) {
          const t = store.createCanvas('biome' + type + '_' + v, 32, 32);
          drawBiomeTexture(t.getContext(), 32, +type, v, 0);
        }
      } catch (e) { console.warn(e); }
      return { textures: store, failures };
    })();
    return assetsPromise;
  }

  // ── Sprite appearance: the game's own resolution, on our canvas textures ──
  function prepareSprites(entry, depth) {
    if (!entry) return [];
    const scene = { save: {}, depth, textures: assets.textures, cellM: WorldGen.CELL_M };
    const roles = new WeakMap();
    for (const o of entry.objects || []) if (o.kind === 'house') { try { roles.set(o, Houses.displayRole(scene.save, o)); } catch (_) {} }
    const { resolveAppearance } = Render.objectAppearance(scene, roles);
    const out = [];
    const push = (o, look, cat) => { if (look?.visible) out.push({ o, appearance: look, cat }); };
    for (const o of entry.objects || []) {
      let look;
      try { look = o.kind === 'trap' ? { visible: true, texKey: 'trap_hidden', scl: 1, scaleYMul: 1, origin: [.5, .5], dxPx: 0, dyPx: 0 }
        : resolveAppearance(o); } catch (_) { continue; }
      if (look?.visible && look.texKey !== 'trap_hidden') { try { look.tint = Render.spriteTint(o, scene, look.texKey); } catch (_) {} }
      push(o, look);
    }
    for (const o of entry.wildplants || []) {
      const spec = wildplantSprite(o), stage = Math.min(MAX_GROWTH_STAGE, o.stage ?? MAX_GROWTH_STAGE);
      const custom = spec?.custom, spring = spec?.sheet === 'springcrops';
      push(o, { visible: true, texKey: custom ? spec.sheet : spring ? 'springcrops' : 'crops',
        frameVal: custom ? wildplantFrame(o) : spring ? spec.row * SPRING_CROPS_COLS + stage : (CROP_ROW[o.crop] ?? 1) * CROPS_SHEET_COLS + stage,
        scl: spec?.scale ?? 2, scaleYMul: 1, origin: [.5, .5], dxPx: 0, dyPx: 0 });
    }
    for (const o of entry.creatures || []) {
      // NPCs have no roster row: they draw through npcAppearance (villager
      // sheets with their own tint), exactly as map-review does. Everything
      // else uses the roster's art (whose scale already folds in artScale).
      let look = null;
      try {
        if (o.kind === 'npc') {
          const npc = SpriteLayout.npcAppearance(o, 0);
          look = { visible: true, texKey: npc.sheet, frameVal: npc.frame,
            scl: SpriteLayout.creatureScale('npc', 1), scaleYMul: 1,
            origin: [.5, SpriteLayout.creatureArt('npc').foot], dxPx: 0, dyPx: 0, tint: npc.tint };
        } else {
          const art2 = SpriteLayout.creatureArt(o.kind);
          if (art2) look = { visible: true, texKey: art2.sheet, frameVal: 0,
            // inst = 1: the viewer normalizes per-INSTANCE size variety (child
            // roles, elites, pets) to the kind's base scale - geometry review,
            // not population flavor. The game draws the variety via
            // creatureInstScale; per-KIND sizes (deer vs chicken) stay real.
            scl: SpriteLayout.creatureScale(o.kind, 1),
            scaleYMul: 1, origin: [.5, art2.foot], dxPx: 0, dyPx: -(art2.float || 0),
            tint: SpriteLayout.creatureTint(o.kind), alpha: SpriteLayout.creatureAlpha(o.kind) };
        }
      } catch (_) { continue; }
      push(o, look, 'creature');
    }
    out.sort((a, b) => a.o.y - b.o.y || a.o.x - b.o.x);
    return out;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const frameCache = new Map();
  function tintedFrame(texture, frame, tint) {
    const key = texture + '#' + frame.name + '#' + (tint ?? 0xffffff);
    if (frameCache.has(key)) return frameCache.get(key);
    const canvas = document.createElement('canvas'); canvas.width = frame.width; canvas.height = frame.height;
    const g = canvas.getContext('2d'), source = texture.getSourceImage();
    const draw = () => g.drawImage(source, frame.x, frame.y, frame.width, frame.height, 0, 0, frame.width, frame.height);
    draw();
    if (tint && tint !== 0xffffff) {
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = '#' + tint.toString(16).padStart(6, '0'); g.fillRect(0, 0, frame.width, frame.height);
      g.globalCompositeOperation = 'destination-in'; draw();
    }
    frameCache.set(key, canvas); return canvas;
  }

  function draw() {
    if (!assets) return;
    const W = WorldGen, R = FloorViewerRegion, T = W.T;
    // Proposed = the shift: floor F shows the real pipeline's floor F-1 (the
    // goblin city has no generator yet, so proposed 2 stays the current 2
    // with a sketch note). Floor 1 is identical in both.
    const shift = mode === 'proposed' && floor >= 3 ? 1 : 0;
    const depth = Math.max(0, floor - shift);
    const entry = entries[floor === 0 ? 0 : depth];
    const list = sprites[floor === 0 ? 0 : depth] || [];
    const Wpx = cv.width = innerWidth, Hpx = cv.height = innerHeight;
    const s = Math.max(2, Math.floor(Math.min(Wpx / R.N, Hpx / R.N)));
    const offX = Math.floor((Wpx - R.N * s) / 2), offY = Math.floor((Hpx - R.N * s) / 2);
    ctx.fillStyle = '#14181a'; ctx.fillRect(0, 0, Wpx, Hpx);
    ctx.imageSmoothingEnabled = false;
    // Ground: base colour + the game's baked biome texture per cell.
    for (let y = 0; y < R.N; y++) for (let x = 0; x < R.N; x++) {
      const i = y * R.N + x, type = entry.grid[i];
      const h = ((x) * 2246822519) ^ ((y) * 3266489917);
      let color;
      if (type === T.CAVE_FLOOR) color = '#8f8574';
      else if (type === T.CAVE_WALL) color = '#38352f';
      else if (type === T.CAVE_LAVA) color = '#c8501e';
      else color = '#' + (COLORS[type] ?? 0x71845b).toString(16).padStart(6, '0');
      ctx.fillStyle = color; ctx.fillRect(offX + x * s, offY + y * s, s + .5, s + .5);
      const spec = BIOME_TEX[type];
      if (spec && s >= 8 && !(type === T.CAVE_FLOOR || type === T.CAVE_WALL || type === T.CAVE_LAVA))
        ctx.drawImage(assets.textures.get('biome' + type + '_' + (Math.abs(h) % spec.variants)).getSourceImage(),
          offX + x * s, offY + y * s, s + .5, s + .5);
    }
    // Roads, at their real widths and tier colours, from the surface layer
    // (surface view only). Stroked straight from the drawn geometry so the
    // width tiers read plainly: primary 15 m, secondary 9 m, minor 5.5 m,
    // footway 2 m (roadWidthM + the large-road scale).
    if (floor === 0) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const roads = entry.layers.find(l => l.name === 'transportation');
      const mvtToM = R.EDGE / (roads?.extent || 4096);
      const TIER = { primary: '#9aa0ab', secondary: '#7c7d81', minor: '#5a5751', service: '#5a5751',
        pedestrian: '#8b8272', track: '#a5947c', footway: '#b3a284', path: '#b3a284' };
      const streets = [];
      for (const f of (roads?.features || [])) {
        if (f.type !== 2) continue;
        const width = W.roadOverlayWidthM(f.tags); if (!width) continue;
        const isPath = W.PATH_CLASSES.has(f.tags?.class);
        if (!isPath && W.classifyLine('transportation', f.tags) == null) continue;
        const stroke = line2D => {
          ctx.strokeStyle = TIER[f.tags?.class] || (isPath ? '#b3a284' : '#5a5751');
          ctx.lineWidth = Math.max(2, width / R.EDGE * (R.N * s));
          ctx.beginPath();
          line2D.forEach((p, i2) => {
            const x = offX + p.x * mvtToM / R.EDGE * R.N * s, y = offY + p.y * mvtToM / R.EDGE * R.N * s;
            ctx[i2 ? 'lineTo' : 'moveTo'](x, y);
          });
          ctx.stroke();
        };
        stroke(f.geom[0]);
        if (!isPath) streets.push(f.geom[0]);
      }
      // Variant highlight: the indexed street corridor.
      const chosen = streets[variantIndex % Math.max(1, streets.length)];
      if (chosen) {
        ctx.strokeStyle = '#e08a4f'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
        ctx.beginPath();
        chosen.forEach((p, i2) => {
          const x = offX + p.x * mvtToM / R.EDGE * R.N * s, y = offY + p.y * mvtToM / R.EDGE * R.N * s;
          ctx[i2 ? 'lineTo' : 'moveTo'](x, y);
        });
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // Sprites: the game's appearances, the game's scale rule (cell px / 32).
    const scale = s / 32;
    for (const { o, appearance: p, cat } of list) {
      if (!showCreatures && cat === 'creature') continue;
      const at = { x: offX + o.x / R.EDGE * R.N * s, y: offY + o.y / R.EDGE * R.N * s };
      if (at.x < -40 || at.y < -40 || at.x > Wpx + 40 || at.y > Hpx + 40) continue;
      const t = assets.textures.get(p.texKey), f = t && t.get(p.frameVal);
      if (!f) { ctx.fillStyle = '#ffd86a'; ctx.fillRect(at.x - 1, at.y - 1, 3, 3); continue; }
      const w = (p.displayWidth ?? f.width * p.scl) * scale, h = (p.displayHeight ?? f.height * p.scl * p.scaleYMul) * scale;
      ctx.globalAlpha = p.alpha ?? 1;
      ctx.drawImage(tintedFrame(t, f, p.tint), 0, 0, f.width, f.height,
        at.x + p.dxPx * scale - w * p.origin[0], at.y + p.dyPx * scale - h * p.origin[1], w, h);
      ctx.globalAlpha = 1;
    }
    const extra = mode === 'proposed' && floor === 2
      ? '<br>Proposed floor 2 (goblin city) has no generator yet - the sketch lives in the geometry sheet.' : '';
    tag('<b>' + FLOOR_NAMES[floor] + '</b> - ' + (mode === 'current' ? 'current code' : 'proposed = the shift: floor ' + floor + ' shows the pipeline\u2019s floor ' + depth)
      + '<br>Grove anchor area pick: <b>' + GROVE_AREAS[variantIndex % 4] + '</b>' + extra);
    document.getElementById('variantName').textContent = variantIndex + ' \u00b7 ' + GROVE_AREAS[variantIndex % 4];
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  const floorSeg = document.getElementById('floorSeg');
  for (const f of [0, 1, 2, 3, 4, 5, 6, 7, 8]) {
    const b = document.createElement('button'); b.textContent = f === 0 ? 'S' : String(f);
    b.onclick = () => { floor = f; [...floorSeg.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); };
    if (f === 0) b.classList.add('on');
    floorSeg.appendChild(b);
  }
  document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); draw();
  });
  const ct = document.getElementById('creatureToggle');
  ct.onclick = () => { showCreatures = !showCreatures; ct.classList.toggle('on', showCreatures); ct.textContent = showCreatures ? 'shown' : 'hidden'; draw(); };
  document.getElementById('vMinus').onclick = () => { variantIndex = Math.max(0, variantIndex - 1); draw(); };
  document.getElementById('vPlus').onclick = () => { variantIndex++; draw(); };
  addEventListener('resize', draw);
})();
</script>
</body></html>
