<!doctype html><html lang="en"><meta charset="utf-8"><meta name="artifact-review" content="disabled"><title>Low-poly prop rotation review</title>
<style>body{margin:0;background:#26332e;color:#ede7ce;font:16px system-ui}header{padding:22px 30px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0;color:#c0c8b2}label{margin-right:25px}canvas{display:block}</style>
<header><h1>Crates & rocks · art and rotation review</h1><p>Left: approved sprite art. Right: retained low-poly geometry. Meshes use the original sprite texels for wood, stone and minerals.</p><label>Heading <input id="angle" type="range" min="0" max="360" value="0"></label><button id="sweep">Rotate</button><span id="stats"></span></header><div id="game"></div>
<script src="../vendor/phaser.js"></script><script src="../src/wall_materials.js"></script><script src="../src/wall_surface_renderer.js"></script><script src="../src/wall_perspective.js"></script><script src="../src/prop_lowpoly.js"></script>
<script>
let sweeping=false;document.querySelector('#sweep').onclick=()=>sweeping=!sweeping;
const fixtures=[{kind:'crate',name:'Timber crate',texture:'box',frame:0,width:13,height:6,depth:13},{kind:'rock',name:'Small stone',texture:'rock',frame:0,width:17,height:4,depth:16.15},{kind:'rock',name:'Boulder',texture:'rock',frame:1,width:27,height:7,depth:26},{kind:'rock',name:'Mineral stone',texture:'rock',frame:20,mineral:'iron',width:17,height:4,depth:16.15},{kind:'rock',name:'Stone variation',texture:'rock',frame:0,width:17,height:4,depth:16.15},{kind:'rock',name:'Mineral boulder',texture:'rock',frame:23,mineral:'gold',width:27,height:7,depth:26}];
window.propReviewGame=new Phaser.Game({type:new URLSearchParams(location.search).has('canvas')?Phaser.CANVAS:Phaser.WEBGL,width:1080,height:720,parent:'game',backgroundColor:'#26332e',pixelArt:true,scene:{preload(){this.load.image('prop_materials','../assets/Objects/LowPolyProps/materials.png');this.load.spritesheet('box','../assets/Objects/SelectedProps/box.png',{frameWidth:16,frameHeight:16});this.load.spritesheet('rock','../assets/Objects/Rocks/rocks-16.png',{frameWidth:16,frameHeight:16});this.load.spritesheet('mineral','../assets/Objects/Approved/mineralrock.png',{frameWidth:16,frameHeight:16});},create(){window.propReviewScene=this;this.panels=[];
fixtures.forEach((f,i)=>{const cx=180+i%3*360,cy=175+Math.floor(i/3)*350;this.add.text(cx,cy-140,f.name,{fontSize:'19px',color:'#ede7ce'}).setOrigin(.5);this.add.text(cx-83,cy+115,'Approved',{fontSize:'14px',color:'#c0c8b2'}).setOrigin(.5);this.add.text(cx+75,cy+115,'Low-poly',{fontSize:'14px',color:'#c0c8b2'}).setOrigin(.5);
const root=this.add.container(cx+75,cy),floor=this.add.graphics();root.add(floor);floor.fillStyle(0x65744b);floor.fillRect(-26,-26,52,52);floor.lineStyle(.35,0x9a9e73,.45);floor.strokeRect(-26,-26,52,52);floor.lineBetween(0,-26,0,26);floor.lineBetween(-26,0,26,0);this.add.image(cx-83,cy,f.texture,f.frame).setDisplaySize(f.width*2.1,f.width*2.1);
const scene={_headingUp:true,depth:0,mapRot:0,events:this.events,add:this.add,textures:this.textures,buildingWallContainer:root,worldContainer:root};const group=WallPerspective.begin(scene,'looseProps');group.perWall=true;group.renderDepth=0;group.atlas=this.textures.get('prop_materials');const geometry=PropLowPoly.geometry(f.kind,{...f,x:0,y:0,id:'review-'+i});if(!geometry)throw Error('No geometry: '+f.kind);WallPerspective.prism(scene,'looseProps',geometry.points,0,geometry.top,geometry.colors,null,true,geometry);WallPerspective.finish(scene,'looseProps');this.panels.push({scene,root,geometry});});window.ready=true;},update(t,dt){const control=document.querySelector('#angle');if(sweeping)control.value=(+control.value+dt*.025)%360;const angle=+control.value*Math.PI/180;for(const panel of this.panels||[]){panel.scene.mapRot=angle;panel.root.setRotation(angle).setScale(2.1);WallPerspective.update(panel.scene)}document.querySelector('#stats').textContent=Math.round(+control.value)+'°';}}});
</script></html>
