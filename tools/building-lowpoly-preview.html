<!doctype html><meta charset="utf-8"><title>Low-poly building review</title>
<style>body{margin:0;background:#243947;color:#efe8da;font:16px system-ui}header{padding:16px;position:relative;z-index:2;background:#243947}label{margin-right:24px}select,input,button{font:inherit}p{margin:8px 0}canvas{display:block}</style>
<header><b>Retained low-poly buildings · texture detail</b><p>Exact notched footprints. Straight roof planes with gable infill. 1–3 floors. Timber-framed cottages with clay, slate and thatch textures.</p><label>Compass <input id="angle" type="range" min="0" max="360" value="0"></label><label>Roof <select id="roof"><option>ridge</option><option value="styles">role styles</option><option>inset</option><option>shallow</option><option>flat</option></select></label><label>Footprints <select id="footprints"><option value="complex">complex outlines</option><option value="cottages">compact cottages</option></select></label><button id="sweep">Sweep</button><span id="stats"></span></header><div id="game"></div>
<script src="../vendor/phaser.js"></script><script src="../src/building_styles.js"></script><script src="../src/building_lowpoly.js"></script><script src="building-roof-fixtures.js"></script>
<script>
let reviewScene,sweeping=false;const recipes=[{material:'timber',finish:'cottage',roofMaterial:'clay',body:0xb49a78,trim:0x614534,roof:0xac6d51,stories:1},{material:'plaster',finish:'cottage',roofMaterial:'slate',body:0xc6b594,trim:0x614534,roof:0x536c79,stories:2},{material:'plaster',finish:'cottage',roofMaterial:'thatch',body:0xb69c7d,trim:0x614534,roof:0xc59e60,stories:3}];
function rebuild(){const s=reviewScene;BuildingLowPoly.begin(s);const compact=document.querySelector('#footprints').value==='cottages';
const cottages=[[[0,0],[85,0],[85,110],[0,110]],[[0,0],[80,0],[80,55],[115,55],[115,110],[0,110]],[[0,0],[80,0],[80,90],[0,90]],[[30,0],[90,0],[90,40],[120,40],[120,90],[90,90],[90,120],[30,120],[30,90],[0,90],[0,40],[30,40]],[[0,0],[85,0],[85,45],[110,45],[110,110],[0,110]],[[0,0],[65,0],[65,35],[110,35],[110,110],[0,110]]].map(points=>({points}));
(compact?cottages:BuildingRoofFixtures).forEach((f,i)=>{
 const pts=f.points.map(([x,y])=>({x:x*(compact?1.6:1)+70+(i%3)*345,y:y*(compact?1.6:1)+145+Math.floor(i/3)*365}));
 const choice=document.querySelector('#roof').value;
 const style=['adobe','whitewash','brick','japanese','pyramid','multistorey'][i];
 BuildingLowPoly.add(s,pts,{...recipes[i%3],style,...(compact?{stories:i===5?2:1}:{})},choice==='styles'?null:choice);
});BuildingLowPoly.update(s);document.querySelector('#stats').textContent=s._lowpoly.buildings.reduce((n,m)=>n+m.roofTriangles+(m.trimTriangles||0),0)+' roof + edge triangles · '+s._lowpoly.faces.length+' total / six buildings';}
new Phaser.Game({type:Phaser.WEBGL,width:1100,height:880,parent:'game',backgroundColor:'#476878',antialias:true,scene:{preload(){this.load.image('building_material_reference','../assets/Objects/BuildingMaterials/reference-materials-v3.png');this.load.image('approved_materials_v1','../assets/Objects/BuildingMaterials/approved-materials-v1.png');},create(){reviewScene=window.reviewScene=this;this._headingUp=true;this.buildingWallContainer=this.add.container();rebuild();window.ready=true;},update(t,dt){if(sweeping)document.querySelector('#angle').value=(+document.querySelector('#angle').value+dt*.025)%360;this.mapRot=+document.querySelector('#angle').value*Math.PI/180;this.cameras.main.setRotation(this.mapRot).setZoom(.78);BuildingLowPoly.update(this);}}});
document.querySelector('#roof').onchange=rebuild;document.querySelector('#footprints').onchange=rebuild;document.querySelector('#sweep').onclick=()=>sweeping=!sweeping;
</script>
