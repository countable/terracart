<!doctype html>
<!--
  MAP REVIEW — what the world generator places, on a real map, around a Home
  you choose.

    https://countable.github.io/terracart/tools/map-review.html     (published)
    ?lat=49.28&lon=-123.12&r=1        any area, fetched live ((2r+1)² tiles)
    Locally: python3 -m http.server 8000 from the repo root, then
    http://localhost:8000/tools/map-review.html — the recorded fixture tiles
    when they are on disk (git-ignored, so Pages fetches the same tiles live).

  It runs the GAME'S OWN CODE, not a copy of it: tools/game-loader.js reads
  the module list out of index.html at load (so it can't drift) and loads
  app.js against a no-op Phaser stub so it defines MapScene without booting a
  game. Every tile is
  built the way the game builds it — WorldGen.rasterizeTile, then the scene's
  own spawnInTile (fauna, wild slimes, buried X marks, the treasure scatter,
  traps, fruit trees, and the starting area when Home is in the tile) on a
  light scene object. Hard-mode ruin garrisons come from Lairs.garrisonFor
  with Home as their homeM. The world is a pure function of where it is, so
  this is what a player there would find, minus what their save changed.

  Click "Place Home", then the map: Home moves there and every tile is
  rebuilt around it — the softwood pines, the chest tiers' home rings, the
  garrison counts and the starting area all follow. The save is disabled; the
  page never writes one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="artifact-review" content="disabled">
<title>Map review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#111}
  #map{position:absolute;inset:0 290px 0 0}
  #side{position:absolute;top:0;right:0;bottom:0;width:290px;overflow:auto;padding:10px;box-sizing:border-box;background:#1b1b1b;color:#ddd}
  #side h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aaa}
  #side label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer}
  .sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
  .sq{border-radius:2px}
  .n{margin-left:auto;color:#888;font-variant-numeric:tabular-nums}
  .leaflet-image-layer{image-rendering:pixelated}
  button{margin:2px 4px 2px 0;background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:4px 9px;cursor:pointer}
  button.on{background:#c8a64a;color:#1a1612;border-color:#c8a64a}
  #status{color:#c8a64a;margin:6px 0;min-height:1.2em}
  #game{display:none}
  #zonePick,#sourceFilter{width:100%;background:#292929;color:#eee;border:1px solid #666;padding:5px;margin:3px 0}
  #zoneDetails{font-size:12px;line-height:1.5;margin:8px 0;padding:8px;background:#242c2c}
  #zoneDetails p{margin:6px 0} #sourceLegend{font-size:11px;line-height:1.5}
  .zone-label{background:#122f2be8;border:1px solid #3c8f80;color:#fff;font-weight:600;font-size:11px}
</style>
</head>
<body>
<div id="map"></div>
<div id="side">
  <div><b>Map review</b></div>
  <div id="status">loading the game…</div>
  <div><button id="placeHome">Place Home</button></div>
  <h3>Park / zone variants</h3>
  <label><input id="zoneLabels" type="checkbox" checked> Show variant labels</label>
  <select id="zonePick" aria-label="Park or zone"><option value="">Loading zones…</option></select>
  <div id="zoneDetails">Select a park or zone to inspect its layout and other spawns.</div>
  <label for="sourceFilter">Show placements</label>
  <select id="sourceFilter"><option value="all">All sources</option><option value="ground">Ground placements (hide fauna)</option><option value="variant">Variant only + POIs</option><option value="other">Other spawns + POIs</option></select>
  <label><input id="sourceColors" type="checkbox"> Color markers by source</label>
  <details><summary>Source colors</summary><div id="sourceLegend"></div></details>
  <h3>Difficulty</h3><div id="modes"></div>
  <h3>Base map</h3><div id="bases"></div>
  <div id="artStatus" hidden style="color:#aaa;margin:4px 0"></div>
  <div id="artOptions" hidden><label><input id="restoredLamps" type="checkbox">Preview restored roads and lamps</label></div>
  <h3>Overlays</h3><div id="ovl"></div>
  <h3>Density band</h3>
  <div>interactables per view: <input id="dmin" type="number" value="5" min="0" style="width:3.5em"> to
    <input id="dmax" type="number" value="20" min="0" style="width:3.5em"></div>
  <div id="dstats" style="margin-top:4px"></div>
  <h3>Placed things</h3>
  <div id="scope" style="color:#888;margin:-2px 0 6px"></div>
  <div><button id="all">all</button><button id="none">none</button></div>
  <div id="kinds"></div>
  <h3>Terrain legend</h3><div id="legend"></div>
</div>
<div id="game"></div>
<script src="game-loader.js"></script>
<script src="map-review-zones.js"></script>
<script src="map-review-art.js"></script>
<script>
// ── Tiles ───────────────────────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const FIXTURES = !Q.get('lat');
async function tileBytes(tx, ty) {
  if (FIXTURES) {
    // The recorded tiles, when the page is served from a checkout (they are
    // git-ignored, so GitHub Pages has none) — else the same tiles, live.
    const r = await fetch(`../test/fixtures/${tx}_${ty}.pbf`).catch(() => null);
    if (r && r.ok) return new Uint8Array(await r.arrayBuffer());
  }
  // The game's own fetch: IndexedDB-cached (same origin, same store as the
  // game), live TileJSON template, stale records refreshed in the background.
  try { return (await WorldGen.fetchTileBytes(tx, ty)).bytes; } catch (_) { return null; }
}
function tileList() {
  if (FIXTURES) {
    const out = [];
    for (let y = 5565; y <= 5567; y++) for (let x = 2753; x <= 2755; x++) out.push([x, y]);
    return out;
  }
  const lat = +Q.get('lat'), lon = +Q.get('lon'), r = +(Q.get('r') || 1), n = 1 << WorldGen.Z;
  const cx = Math.floor((lon + 180) / 360 * n);
  const cy = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
  const out = [];
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) out.push([cx + dx, cy + dy]);
  return out;
}
const n14 = () => 1 << WorldGen.Z;
// World metres (tile × tileEdgeM + offset — what the generator places in) ↔ lat/lon.
const toLL = (x, y, edge) => {
  const u = x / edge / n14(), v = y / edge / n14();
  return [Math.atan(Math.sinh(Math.PI * (1 - 2 * v))) * 180 / Math.PI, u * 360 - 180];
};
const toM = (lat, lon, edge) => {
  const u = (lon + 180) / 360;
  const v = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2;
  return { x: u * n14() * edge, y: v * n14() * edge };
};

// ── Building the world around a Home ────────────────────────────────────────
let raw = null;          // [{ tx, ty, layers, bin }] — decoded / fetched once
let EDGE = 0;            // the one tileEdgeM the scene uses (the start row's, as app.js does)
async function fetchTiles() {
  raw = [];
  const list = tileList();
  EDGE = WorldGen.tileEdgeMeters(WorldGen.latOfRowCentre(list[Math.floor(list.length / 2)][1]));
  // A few tiles in flight at once; raw keeps tileList() order regardless.
  const got = new Array(list.length);
  let next = 0, done = 0;
  const worker = async () => {
    while (next < list.length) {
      const i = next++, [tx, ty] = list[i];
      const [b, bin] = await Promise.all([
        tileBytes(tx, ty),
        WorldGen.getTileBin(tx, ty, WorldGen.latOfRowCentre(ty)),
      ]);
      if (b) got[i] = { tx, ty, layers: MVT.decodeTile(b), bin };
      $('status').textContent = `fetching tiles… ${++done}/${list.length}`;
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  raw = got.filter(Boolean);
}

// A scene with the fields spawnInTile and its helpers read, and no-ops for
// what it would draw or pop. Built on MapScene.prototype so every method
// spawnInTile calls is the shipping one.
function reviewScene(home) {
  const s = Object.create(MapScene.prototype);
  Object.assign(s, {
    tileEdgeM: EDGE,
    depth: 0,
    save: {},
    startWorldM: home,
    playerM: { x: 0, y: 0 },
    // The frame create() lays: world metres = world px × mPerPx, anchored
    // on Home (startWorldM), the grid per row (cellsForRow).
    mPerPx: EDGE / WorldGen.TILE_PX,
    originPx: { x: home.x / (EDGE / WorldGen.TILE_PX), y: home.y / (EDGE / WorldGen.TILE_PX) },
    cellM: WorldGen.CELL_M,
    cellsForRow: WorldGen.cellsPerEdgeForTile,
    cellPx: 32, feetOffsetM: 0, peekM: { x: 0, y: 0 },
    _popEnergy() {}, _cropRaidable: [], flash() {}, flashLoot() {},
  });
  s.cellsPerTile = WorldGen.cellsPerEdgeForTile(raw[Math.floor(raw.length / 2)].ty);
  return s;
}

function buildWorld(home) {
  HomeArea.setOrigin(home.x, home.y);
  WorldGen.tileCache.clear();
  const scene = reviewScene(home);
  const tiles = [];
  for (const { tx, ty, layers, bin } of raw) {
    const N = WorldGen.cellsPerEdgeForTile(ty);
    const r = WorldGen.rasterizeTile(layers, N, tx, ty, EDGE);
    const entry = Object.assign({ tx, ty, cellsPerEdge: N, tileEdgeM: EDGE, layers }, r);
    entry.objects = r.objects.slice();
    // Match loadTile: keep the generated layer stable, then seat real-world
    // trees before authored dressing is replayed by spawnInTile. Cached bin
    // rows are cloned by injectTileBin, so rerolls and moving Home reuse them.
    WorldGen.maybePlaceCaveEntrance(entry, tx, ty, EDGE, r.objects, r.wildplants);
    entry.baseGrid = entry.grid.slice();
    entry.genObjects = entry.objects.slice();
    entry.hadBin = !!bin;
    WorldGen.injectTileBin(entry, bin, tx, ty);
    WorldGen.stampPoiDensity(entry.objects);
    ZoneReview.capture(entry);
    WorldGen.tileCache.set(WorldGen.tileKey(tx, ty), entry);
    tiles.push(entry);
  }
  const errors = [];
  for (const e of tiles) {
    try { scene.spawnInTile(e, e.tx, e.ty); } catch (err) { errors.push(`spawnInTile ${e.tx}/${e.ty}: ${err.stack}`); }
  }
  // Ruin garrisons, with Home as their homeM — held ruins are a HARD-mode
  // rule, so on easy there are none.
  const guards = [];
  for (const e of (Difficulty.isHard() ? tiles : [])) {
    try {
      const cellM = EDGE / e.cellsPerEdge;
      const idx = Lairs.buildIndex(e, e.tx, e.ty, cellM, EDGE);
      for (const bucket of idx.buckets.values()) {
        for (const cand of bucket) {
          for (const g of Lairs.garrisonFor(e, cand, { tileEdgeM: EDGE, homeM: home })) guards.push(g);
        }
      }
    } catch (err) { errors.push(`garrison ${e.tx}/${e.ty}: ${err.message}`); }
  }
  return { tiles, guards, errors, scene };
}

// ── The map ─────────────────────────────────────────────────────────────────
const map = L.map('map', { preferCanvas: true, maxZoom: 21 });
const bases = {
  'Streets (OSM)': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 21, attribution: '© OpenStreetMap' }),
  'Satellite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 21, attribution: 'Esri' }),
};
const $ = (id) => document.getElementById(id);
const mkRow = (host, type, html, checked, on, name) => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="${type}"${name ? ` name="${name}"` : ''}${checked ? ' checked' : ''}> ${html}`;
  const i = l.querySelector('input'); i.onchange = () => on(i.checked); host.appendChild(l); return i;
};
const gameArt = MapReviewArt.layer({
  toLL, getEdge: () => EDGE,
  onStatus: (message) => { $('artStatus').textContent = message; },
  visible: (e, o, category, kind) => {
    const k = kind || classify(o);
    return showSource(e ? ZoneReview.source(e, o, category) : 'runtime') && (state.shown[k] ?? onByDefault(k));
  },
});
bases['Game art'] = gameArt;
const DEFAULT_BASE = 'Game art';
bases[DEFAULT_BASE].addTo(map);
$('artStatus').hidden = $('artOptions').hidden = DEFAULT_BASE !== 'Game art';
$('restoredLamps').onchange = () => gameArt.setRestoredLamps($('restoredLamps').checked);
Object.keys(bases).forEach((k) => mkRow($('bases'), 'radio', k, k === DEFAULT_BASE, () => {
  Object.values(bases).forEach((b) => map.removeLayer(b)); bases[k].addTo(map).bringToBack();
  $('artStatus').hidden = k !== 'Game art';
  $('artOptions').hidden = k !== 'Game art';
  syncMarkers();
}, 'base'));

const FIXED = { tree: '#1f9d3a', fruittree: '#9be15d', house: '#8a6a4a', tower: '#6f7fa8',
  chest: '#ff3b3b', mineralrock: '#c9c9c9', trap: '#ff2bd6', 'enemy: garrison': '#ff7a00',
  'enemy: slime': '#b000ff', coindrop: '#efc46a', 'X mark': '#ffe600', Home: '#ffffff' };
const colour = (k, i) => FIXED[k] || `hsl(${Math.round(i * 137.508 % 360)},80%,55%)`;
// Everything is shown (and so counted for density) but the traps: a trap is
// hidden until it springs, so it is not something on screen to interact with.
const onByDefault = (k) => k !== 'trap';
const state = {
  layers: {}, shown: {}, markersShown: false,
  get markersOff() { return map.hasLayer(gameArt) || !this.markersShown; },
};
let markersToggle;
function syncMarkers() {
  if (markersToggle) {
    markersToggle.checked = !state.markersOff;
    markersToggle.disabled = map.hasLayer(gameArt);
  }
  for (const [k, layer] of Object.entries(state.layers)) {
    if (!state.markersOff && (state.shown[k] ?? onByDefault(k))) layer.addTo(map);
    else map.removeLayer(layer);
  }
}
let drawn = [];

// ── SHAPES: related kinds share a marker shape ─────────────────────────────
// Circles are animals, triangles grow (plants and trees), diamonds are foes,
// stars are loot, squares are built or stone, crosses are traps. Drawn on
// Leaflet's canvas renderer as one more CircleMarker (same hit test, same
// speed), so tens of thousands stay cheap.
function shapeOf(k) {
  if (k === 'Home') return 'circle';
  if (k.startsWith('animal:')) return 'circle';
  if (k.startsWith('plant:') || k === 'tree' || k === 'fruittree') return 'triangle';
  if (k.startsWith('enemy:')) return 'diamond';
  if (k === 'chest' || k === 'coindrop' || k === 'X mark' || k === 'staircase') return 'star';
  if (k === 'trap') return 'cross';
  return 'square';
}
// Screen pixels keep shared cells readable at every zoom; world positions
// remain unchanged for inspection, zone membership and density counts.
function markerOffset(k) {
  if (k.startsWith('animal:')) return [6, -6];
  if (k.startsWith('enemy:')) return [-6, -6];
  if (k.startsWith('resident:')) return [6, 6];
  return [0, 0];
}
function shapePath(ctx, shape, x, y, r) {
  ctx.beginPath();
  if (shape === 'triangle') {
    ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r, y + r * 0.75); ctx.lineTo(x - r, y + r * 0.75);
  } else if (shape === 'diamond') {
    ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r * 1.2); ctx.lineTo(x - r, y);
  } else if (shape === 'square') {
    ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7);
  } else if (shape === 'star') {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r * 1.25;
      ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
  } else if (shape === 'cross') {
    const w = r * 0.45;
    ctx.moveTo(x - w, y - r); ctx.lineTo(x + w, y - r); ctx.lineTo(x + w, y - w); ctx.lineTo(x + r, y - w);
    ctx.lineTo(x + r, y + w); ctx.lineTo(x + w, y + w); ctx.lineTo(x + w, y + r); ctx.lineTo(x - w, y + r);
    ctx.lineTo(x - w, y + w); ctx.lineTo(x - r, y + w); ctx.lineTo(x - r, y - w); ctx.lineTo(x - w, y - w);
  } else {
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  ctx.closePath();
}
const ShapeMarker = L.CircleMarker.extend({
  _project() {
    L.CircleMarker.prototype._project.call(this);
    this._point = this._point.add(this.options.pixelOffset || [0, 0]);
    this._updateBounds();
  },
  _getPopupAnchor() { return this.options.pixelOffset || [0, 0]; },
  _getTooltipAnchor() { return this.options.pixelOffset || [0, 0]; },
  _updatePath() {
    const rd = this._renderer;
    if (!rd._drawing || this._empty()) return;
    shapePath(rd._ctx, this.options.shape, this._point.x, this._point.y, Math.max(Math.round(this._radius), 1));
    rd._fillStroke(rd._ctx, this);
  },
});
const shapeSwatch = (shape, colour) => {
  const c = document.createElement('canvas'); c.width = c.height = 14;
  const g = c.getContext('2d'); shapePath(g, shape, 7, 7, 5);
  g.fillStyle = colour; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 1; g.stroke();
  return `<img src="${c.toDataURL()}" width="14" height="14" style="flex:none">`;
};

function classify(o) {
  if (o.kind === 'wildplant') return 'plant:' + (o.crop || '?');
  if (o.kind === 'treasure' || o.kind === 'xmark' || o.kind === 'buried') return 'X mark';
  return o.kind;
}
// THE CLICK LABEL: what a marker IS, in full — a POI chest's name, its OSM
// class / subclass (read back off the tile's own poi layer by the chest's
// `_poiAt` point), its look and tier (world tier, and the roll tier Home
// softens), and the influence zone it anchors (src/zones.js), if any; any
// other object's kind, species / crop, zone piece and id. The hover label
// stays the one-liner.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function poiTagsOf(e) {
  if (e._poiTags) return e._poiTags;
  const m = new Map();
  const layers = e.layers || [];
  const poi = WorldGen.parkPoiLayer(layers.find(l => l.name === 'poi'), layers.find(l => l.name === 'park'));
  for (const f of (poi && poi.features) || []) {
    for (const ring of f.geom || []) { const p = ring && ring[0]; if (p) m.set(`${p.x},${p.y}`, f.tags || {}); }
  }
  return (e._poiTags = m);
}
function zoneAnchorOf(e, o) {
  if (!o._poiAt || !e.zone || typeof Zones === 'undefined') return null;
  const tags = poiTagsOf(e).get(o._poiAt);
  const k = tags && Zones.anchorOf(tags);
  if (!k) return null;
  const [lx, ly] = o._poiAt.split(',').map(Number);
  const a = e.zone.anchors.find((z) => z.owned && z.lx === lx && z.ly === ly);
  return { kind: k.kind, ghosts: k.ghosts, a };
}
function popupHTML(e, o, label) {
  const rows = [`<b>${esc(o.name || label)}</b>`];
  const category = (e.creatures || []).includes(o) ? 'creature' : '';
  rows.push(`Source: <b>${esc(ZoneReview.SOURCES[ZoneReview.source(e,o,category)].label)}</b>`);
  if (o.zoneVariant) rows.push(`Variant: <b>${esc(ZoneVariants.byId(o.zoneVariant)?.name || o.zoneVariant)}</b>${o.zoneLayer ? ' · '+esc(o.zoneLayer) : ''}`);
  if (o.kind === 'npc') {
    rows.push(`Role: <b>${esc(o.roleLabel || o.role)}</b> (${esc(o.role)})`);
    rows.push(`Home zone: ${esc(o.zone)} · trade theme: ${esc(o.shopTheme || 'none')}`);
    rows.push(`Appearance: ${esc((o.npcVariant ?? 0) + 1)} · tint #${(o.tint ?? 0xffffff).toString(16).padStart(6, '0')}`);
    rows.push('Combat stats: noncombatant');
    const talk = NPC.dialogue(window.__world.scene, o);
    rows.push(`<b>Today's dialogue</b><br>${esc(talk.body).replace(/\n/g, '<br>')}`);
    rows.push('<small>Daily dialogue for this review world, with no player progress.</small>');
  } else if (o.kind === 'chest' || o.kind === 'grove_shrine') {
    const tags = (o._poiAt && poiTagsOf(e).get(o._poiAt)) || {};
    rows.push(`POI: ${esc(o.poiClass || tags.class || '?')}${tags.subclass && tags.subclass !== o.poiClass ? ' / ' + esc(tags.subclass) : ''}`);
    if (o.kind === 'grove_shrine') rows.push('Grove shrine · daily gift');
    else {
      const look = typeof chestLook === 'function' ? chestLook(o) : null;
      const wt = typeof chestTier === 'function' ? chestTier(o) : '?';
      rows.push(`look: ${esc(look ? (look.texKey || look.kind || JSON.stringify(look)) : '?')} · tier T${wt} (${o.poiDensity || '?'} of its kind on the tile)`);
    }
    const z = zoneAnchorOf(e, o);
    if (z) {
      rows.push(`zone anchor: <b>${esc(z.kind)}</b>${z.kind === 'stones' ? (z.ghosts ? ' (ghosts)' : ' (quiet)') : ''}`
        + (z.a ? ` · R ${z.a.R.toFixed(0)} m · q ${z.a.q.toFixed(2)} · ${esc(z.a.variant || z.a.aspect)}` : ' · merged / off-tile')
        + (o.zoneNexus ? ' · nexus +tier' : ''));
      const d = z.a && e.zoneDress && e.zoneDress.diagnostics.find(d => d.anchorKey === z.a.key);
      if (d) rows.push(`${d.placed} placements · ${d.eligible} eligible cells · finds ${d.findsPlaced}/${d.findsRequested}`
        + (d.shortfalls.length ? ` · blocked: ${esc(d.shortfalls.join(', '))}` : ''));
    }
  } else {
    const what = [o.kind === 'wildplant' ? o.crop : o.kind, o.species, o.poiClass].filter(Boolean).join(' · ');
    if (what) rows.push(esc(what));
    if (o.zone) rows.push(`zone piece: ${esc(o.zone)}`);
  }
  rows.push(`<code>${esc(o.id || '')}</code>`);
  return rows.join('<br>');
}
// Zone selection names the actual row, including parks whose chest was clipped.
const zoneLabels = L.layerGroup().addTo(map), zoneSelection = L.layerGroup().addTo(map);
let zoneReviews = new Map();
function zoneTitle(z) { return `${z.name || z.anchor.kind} · ${z.variant?.name || 'No variant'}`; }
function selectZone(id, focus) {
  $('zonePick').value = id;
  zoneSelection.clearLayers();
  const z = zoneReviews.get(id);

function updateZoneReview(world) {

$('zonePick').onchange=()=>selectZone($('zonePick').value,true);

const showSource = source => $('sourceFilter').value === 'all' || source === 'place'

$('sourceLegend').innerHTML=Object.values(ZoneReview.SOURCES).map(s=>`<span style="color:${s.color}">● ${esc(s.label)}</span>`).join('<br>');

function draw(world, home) {
  drawn.forEach((l) => map.removeLayer(l)); drawn = [];
  const groups = {};
  const add = (k, ll, label, id, x, y, popup, source = 'runtime') => {
    if (k !== 'Home' && !showSource(source)) return;
    (groups[k] = groups[k] || []).push({ ll, label, id, x, y, popup, source });
  };
  for (const e of world.tiles) {
    for (const o of e.objects || []) {
      const k = classify(o);
      const tier = (o.kind === 'chest' && typeof chestTier === 'function')
        ? ' · T' + chestTier(o) : '';
      const label = [o.kind, o.species, o.poiClass, o.name].filter(Boolean).join(' · ') + tier;
      add(k, toLL(o.x, o.y, EDGE), label, o.id, o.x, o.y, popupHTML(e, o, label), ZoneReview.source(e,o));
    }
    for (const coin of e.coinDrops || []) {
      const label = `${coin.amount || 1} coin${(coin.amount || 1) === 1 ? '' : 's'}${coin._street === 'golden' ? ' · Golden Road' : ''}`;
      add('coindrop', toLL(coin.x, coin.y, EDGE), label, coin.id, coin.x, coin.y,
        popupHTML(e, coin, label), ZoneReview.source(e, coin));
    }
    for (const candidate of e.wildplants || []) {
      const w = ZoneReview.livePlant(candidate);
      if (w) add(classify(w), toLL(w.x, w.y, EDGE), w.crop, w.id, w.x, w.y, popupHTML(e, w, w.crop), ZoneReview.source(e,w));
    }
    for (const t of e.traps || []) add('trap', toLL(t.x, t.y, EDGE), 'trap', t.id, t.x, t.y, popupHTML(e,t,'trap'), ZoneReview.source(e,t));
    // Buried X marks: the tile's own mark, spawned and rasterized marks in
    // extraTreasures, and parking-lot marks.
    if (e.treasure && Number.isFinite(e.treasure.x)) add('X mark', toLL(e.treasure.x, e.treasure.y, EDGE), 'buried X (the tile\'s own)', e.treasure.id, e.treasure.x, e.treasure.y, popupHTML(e,e.treasure,'Buried X'), ZoneReview.source(e,e.treasure));
    for (const t of e.extraTreasures || []) add('X mark', toLL(t.x, t.y, EDGE), 'buried X', t.id, t.x, t.y, popupHTML(e,t,'Buried X'), ZoneReview.source(e,t));
    for (const t of e.parkingTreasures || []) add('X mark', toLL(t.x, t.y, EDGE), 'buried X (parking lot)', t.id, t.x, t.y, popupHTML(e,t,'Parking treasure'), ZoneReview.source(e,t));

    + (side * side === nT && nT > 1 ? ` (${side}×${side}, ~${(EDGE / 1000).toFixed(1)} km each)` : ` (~${(EDGE / 1000).toFixed(1)} km each)`)
    + ' — total, then per tile.';

    const lg = L.layerGroup();
    const big = k === 'Home' || k.startsWith('enemy') || k === 'X mark' || k === 'chest';
    for (const p of groups[k]) {
      new ShapeMarker(p.ll, { shape: shapeOf(k), pixelOffset: markerOffset(k), radius: k === 'Home' ? 9 : big ? 6 : k.startsWith('plant:') ? 3.5 : 5,
        color: '#000', weight: k === 'Home' ? 3 : 1, fillColor: $('sourceColors').checked && k !== 'Home' ? ZoneReview.SOURCES[p.source].color : colour(k, i), fillOpacity: 0.9 })
        .bindTooltip(p.label, { direction: 'top', offset: [0, -4], opacity: 0.92 })
        .bindPopup(p.popup || `<b>${esc(p.label)}</b><br><code>${esc(p.id || '')}</code>`).addTo(lg);
    }

    mkRow($('kinds'), 'checkbox', `${shapeSwatch(shapeOf(k), colour(k, i))}${k}`
      + `<span class="n" title="total over the loaded tiles">${tot.toLocaleString()}</span>`
      + `<span class="n" style="margin-left:8px;min-width:4.2em;text-align:right" title="average per tile">${k === 'Home' ? '' : (per >= 10 ? Math.round(per) : per.toFixed(1)) + '/tile'}</span>`,
      on, (v) => { state.shown[k] = v; (v && !state.markersOff) ? lg.addTo(map) : map.removeLayer(lg); density(); gameArt.redraw(); });
    state.layers[k] = lg;
  });
  state.groups = groups;
  gameArt.setWorld(world);
  density();
  // Home's own ring: the softwood pines. (The chest-tier rings are gone — a
  // chest's tier is its class's density on its tile, loot.js chestTier.)
  const hll = toLL(home.x, home.y, EDGE);
  const ring = (r, c, t) => { const l = L.circle(hll, { radius: r, color: c, weight: 1, fill: false, dashArray: '6 4' }).bindTooltip(t).addTo(map); drawn.push(l); };
  ring(HomeArea.NEAR_M, '#1f9d3a', `softwood pines within ${HomeArea.NEAR_M} m`);
}

// ── DENSITY: interactables per game view ────────────────────────────────────
// The game shows a VIEW_CELLS × VIEW_CELLS window (app.js). Every counted
// thing lands in its cell of one grid over the whole area; a summed-area
// table then gives the count inside the window centred on EVERY cell, and the
// overlay paints each cell by where its window falls against the band
// (DENSITY_MIN..DENSITY_MAX): red under, clear inside, orange over. What is
// counted is exactly the kinds ticked under "Placed things" — tillable soil
// is not an object and never counts.
const densityLayer = L.layerGroup();
let densityOn = false;
function density() {
  const w = window.__world;
  if (!w || !state.groups) return;
  densityLayer.clearLayers();
  const lo = +$('dmin').value, hi = +$('dmax').value;
  const V = (typeof VIEW_CELLS === 'number') ? VIEW_CELLS : 11, h = (V - 1) / 2;
  const cellM = EDGE / w.tiles[Math.floor(w.tiles.length / 2)].cellsPerEdge;
  const txs = w.tiles.map((e) => e.tx), tys = w.tiles.map((e) => e.ty);
  const x0 = Math.min(...txs) * EDGE, y0 = Math.min(...tys) * EDGE;
  const G = Math.ceil((Math.max(...txs) + 1) * EDGE / cellM - x0 / cellM);
  const GH = Math.ceil((Math.max(...tys) + 1) * EDGE / cellM - y0 / cellM);
  const grid = new Uint16Array(G * GH);
  let counted = 0;
  for (const [k, pts] of Object.entries(state.groups)) {
    if (k === 'Home' || !(state.shown[k] ?? onByDefault(k))) continue;
    for (const p of pts) {
      const gx = Math.floor((p.x - x0) / cellM), gy = Math.floor((p.y - y0) / cellM);
      if (gx >= 0 && gy >= 0 && gx < G && gy < GH) { grid[gy * G + gx]++; counted++; }
    }
  }
  const S = new Float64Array((G + 1) * (GH + 1));
  for (let y = 0; y < GH; y++) for (let x = 0; x < G; x++) {
    S[(y + 1) * (G + 1) + x + 1] = grid[y * G + x] + S[y * (G + 1) + x + 1] + S[(y + 1) * (G + 1) + x] - S[y * (G + 1) + x];
  }
  const box = (x, y) => {
    const xa = x - h, ya = y - h, xb = x + h + 1, yb = y + h + 1;
    return S[yb * (G + 1) + xb] - S[ya * (G + 1) + xb] - S[yb * (G + 1) + xa] + S[ya * (G + 1) + xa];
  };
  const c = document.createElement('canvas'); c.width = G; c.height = GH;
  const g = c.getContext('2d'), img = g.createImageData(G, GH);
  let under = 0, inside = 0, over = 0;
  for (let y = h; y < GH - h; y++) for (let x = h; x < G - h; x++) {
    const n = box(x, y), i = (y * G + x) * 4;
    if (n < lo) { under++; img.data[i] = 230; img.data[i + 1] = 40; img.data[i + 2] = 40; img.data[i + 3] = 110; }
    else if (n > hi) { over++; img.data[i] = 255; img.data[i + 1] = 150; img.data[i + 2] = 0; img.data[i + 3] = 120; }
    else inside++;
  }
  g.putImageData(img, 0, 0);
  const n = n14(), latOf = (yt) => Math.atan(Math.sinh(Math.PI * (1 - 2 * yt / n))) * 180 / Math.PI;
  const bounds = [[latOf(y0 / EDGE + GH * cellM / EDGE), x0 / EDGE / n * 360 - 180],
                  [latOf(y0 / EDGE), (x0 / EDGE + G * cellM / EDGE) / n * 360 - 180]];
  L.imageOverlay(c.toDataURL(), bounds, { opacity: 1 }).addTo(densityLayer);
  const tot = under + inside + over || 1, pct = (v) => Math.round(v / tot * 100);
  $('dstats').innerHTML = `${V}×${V} views: <b style="color:#7ddc6f">${pct(inside)}%</b> in ${lo}–${hi}, `
    + `<b style="color:#ff6b6b">${pct(under)}%</b> under, <b style="color:#ffa53b">${pct(over)}%</b> over`
    + `<br><span style="color:#888">${counted.toLocaleString()} things counted (the ticked kinds)</span>`;
}

// TERRAIN FAMILIES — a review palette, NOT the game's (the game's COLORS
// are deliberately muted khaki and olive, too close to tell apart in an
// overlay). Each family owns a hue; its members step in lightness, so related
// ground reads as related: greens grow, blues are wet, greys are paved, brick
// is built, and so on. A terrain no family names falls to 'Other'.
const TERRAIN_FAMILIES = [
  { name: 'Vegetation', hue: 110, sat: 55, members: ['GRASS', 'PARK', 'PITCH', 'PLAYGROUND', 'GOLF', 'SCHOOL', 'ORCHARD', 'FARMLAND', 'FOREST'] },
  { name: 'Water', hue: 200, sat: 70, members: ['WATER', 'WETLAND', 'PIER'] },
  { name: 'Paved', hue: 220, sat: 6, members: ['PATH', 'ROAD', 'ROAD_MD', 'ROAD_LG'] },
  { name: 'Buildings', hue: 8, sat: 60, members: ['BUILDING', 'BUILDING_MED', 'BUILDING_LARGE'] },
  { name: 'Built-up land', hue: 280, sat: 45, members: ['RESIDENTIAL', 'WASTELAND'] },
  { name: 'Commerce & industry', hue: 30, sat: 75, members: ['COMMERCIAL', 'INDUSTRIAL'] },
  { name: 'Sand & rock', hue: 42, sat: 40, members: ['SAND', 'ROCK'] },
  { name: 'Cave', hue: 15, sat: 30, members: ['CAVE_FLOOR', 'CAVE_WALL', 'CAVE_LAVA'] },
  // The influence-zone halos (src/zones.js): grove, churchyard, tar yard.
  { name: 'Influence zones', hue: 160, sat: 65, members: ['GROVE', 'CHURCHYARD', 'TAR_YARD'] },

const TERRAIN_COLOUR = {}, TERRAIN_FAMILY = {};
for (const f of TERRAIN_FAMILIES) {

// Spawn overlays share the game's verdict: globally blocked or suppressed.
const SPAWN_GATE_COLOUR = { invalid: 'rgba(230,40,40,.62)', suppressed: 'rgba(255,190,40,.58)' };
function overlays(world) {
  const groups = { 'Terrain codes': L.layerGroup(),
    'Global no-spawn zone': L.layerGroup(), 'Suppression zone': L.layerGroup() };
  const gate = [0, 0, 0];   // OPEN, SUPPRESSED, INVALID cells over the loaded tiles
  const tileBounds = [];
  const names = Object.fromEntries(Object.entries(WorldGen.T).map(([k, v]) => [v, k]));
  const used = new Set();
  const hue = (c) => TERRAIN_COLOUR[names[c]] || 'hsl(0,0%,50%)';
  for (const e of world.tiles) {
    const N = e.cellsPerEdge;
    const mk = (paint) => { const c = document.createElement('canvas'); c.width = N; c.height = N; const g = c.getContext('2d'); paint(g); return c.toDataURL(); };
    const terr = mk((g) => { for (let i = 0; i < N * N; i++) { used.add(e.grid[i]); g.fillStyle = hue(e.grid[i]); g.fillRect(i % N, (i / N) | 0, 1, 1); } });
    // Count and paint the shared spawn verdict.
    const sw = e.spawnWhy || null;
    const cls = sw ? Uint8Array.from(sw, (v) => WorldGen.spawnClassOf(v)) : null;
    if (cls) for (let i = 0; i < N * N; i++) {
      gate[cls[i]]++;
    }
    const gateImg = (test, colour) => mk((g) => { g.fillStyle = colour; if (sw) for (let i = 0; i < N * N; i++) if (test(sw[i], i)) g.fillRect(i % N, (i / N) | 0, 1, 1); });
    const inv = gateImg((v, i) => cls[i] === WorldGen.SPAWN_INVALID, SPAWN_GATE_COLOUR.invalid);
    const sup = gateImg((v, i) => cls[i] === WorldGen.SPAWN_SUPPRESSED, SPAWN_GATE_COLOUR.suppressed);
    const n = n14(), latOf = (yt) => Math.atan(Math.sinh(Math.PI * (1 - 2 * yt / n))) * 180 / Math.PI;
    const b = [[latOf(e.ty + 1), e.tx / n * 360 - 180], [latOf(e.ty), (e.tx + 1) / n * 360 - 180]];
    L.imageOverlay(terr, b, { opacity: 0.55 }).addTo(groups['Terrain codes']);
    L.imageOverlay(inv, b, { opacity: 0.85 }).addTo(groups['Global no-spawn zone']);
    L.imageOverlay(sup, b, { opacity: 0.85 }).addTo(groups['Suppression zone']);
    tileBounds.push({ e, b, N, mk });
    L.rectangle(b, { color: '#fff', weight: 1, fill: false, dashArray: '4 4' }).bindTooltip(`tile ${e.tx}/${e.ty}`).addTo(map);
  }
  const coverageLayer = groups['Variant coverage (influence + park + fringe)'] = L.layerGroup();
  for (const { e, b, N, mk } of tileBounds) {
    if (!e.zone || !e.zone.coverage) continue;
    const img = mk(g => {
      for (let i = 0; i < N * N; i++) {
        const slot = e.zone.coverage[i];
        if (!slot) continue;
        const a = e.zone.anchors[slot - 1];
        g.fillStyle = { grove: '#3fd06a', stones: '#b8c0d0', tar: '#ff8a2a', beach: '#e1c481', quarry: '#9d9b8b' }[a.kind];
        g.fillRect(i % N, (i / N) | 0, 1, 1);
      }
    });
    L.imageOverlay(img, b, { opacity: .3 }).addTo(coverageLayer);
  }
  // COMMERCIAL GROUND BY ITS NEAREST POI (WorldGen.commercialPoiField — the
  // one field stampSpawnWhySteps reads): every exterior T.COMMERCIAL /
  // T.INDUSTRIAL cell coloured by the kind of its nearest signalling POI
  // (COMMERCIAL_POI_KIND), none within NEAREST_POI_MAX_M grey, and the POI
  // seeds as dots.
  const COM_COLOUR = { pub: 'rgba(40,200,90,.7)', priv: 'rgba(230,60,40,.7)', none: 'rgba(150,150,150,.7)' };
  const com = { pub: 0, priv: 0, none: 0, seedsPub: 0, seedsPriv: 0 };
  {
    const cg = groups['Commercial: public / private (nearest POI)'] = L.layerGroup();
    const seen = new Set();
    for (const { e, b, N, mk } of tileBounds) {
      const F = WorldGen.commercialPoiField(e.layers, N, N / 4096, N * WorldGen.CELL_M / 4096, e.grid);
      if (!F) continue;
      const img = mk((g) => {
        for (let i = 0; i < N * N; i++) {
          if (!WorldGen.COMMERCIAL_GROUND.has(e.grid[i])) continue;
          const k = F.kind[i] === WorldGen.POI_PUBLIC ? 'pub' : F.kind[i] === WorldGen.POI_PRIVATE ? 'priv' : 'none';
          com[k]++;
          g.fillStyle = COM_COLOUR[k];
          g.fillRect(i % N, (i / N) | 0, 1, 1);
        }
      });
      L.imageOverlay(img, b, { opacity: 0.8 }).addTo(cg);
      for (const s of F.seeds) {
        const gx = e.tx * N + s.ix, gy = e.ty * N + s.iy, key = `${gx}|${gy}|${s.cls}`;
        if (s.ix < 0 || s.iy < 0 || s.ix >= N || s.iy >= N) continue;   // a buffer POI: drawn by its own tile
        if (seen.has(key)) continue;
        seen.add(key);
        s.kind === WorldGen.POI_PUBLIC ? com.seedsPub++ : com.seedsPriv++;
        L.circleMarker(toLL((e.tx + (s.ix + 0.5) / N) * EDGE, (e.ty + (s.iy + 0.5) / N) * EDGE, EDGE),
          { radius: 3, weight: 1, color: '#000', fillOpacity: 1, fillColor: s.kind === WorldGen.POI_PUBLIC ? '#2c6' : '#e33' })
          .bindTooltip(`${esc(s.cls)} · ${s.kind === WorldGen.POI_PUBLIC ? 'public' : 'private'}`).addTo(cg);
      }
    }
  }
  // Influence zones (src/zones.js): each anchor's disc at its R, by kind,
  // with its numbers on click.
  if (typeof Zones !== 'undefined') {
    const zg = groups['Influence zones (anchors, R)'] = L.layerGroup();
    const ZC = { grove: '#3fd06a', stones: '#b8c0d0', tar: '#ff8a2a', beach: '#e1c481', quarry: '#9d9b8b' };
    const seen = new Set();
    for (const e of world.tiles) {
      for (const a of (e.zone && e.zone.anchors) || []) {
        const key = `${a.kind}|${a.gx}|${a.gy}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const ll = toLL(a.gx * EDGE / 4096, a.gy * EDGE / 4096, EDGE);
        if (a.generated === 'parking_lanes') {
          L.circleMarker(ll, { radius: 3, color: ZC.quarry, weight: 1, fillOpacity: .4 })
            .bindTooltip('Quarry · parking-lane component reference; not a POI')
            .bindPopup('<b>Quarry</b><br>Coverage comes from buffered parking-lane geometry, not this reference point. No POI or light source.')
            .addTo(zg);
          continue;
        }
        L.circle(ll, { radius: a.R, color: ZC[a.kind] || '#fff', weight: 1, fillOpacity: 0.08 })
          .bindTooltip(`${a.kind} · R ${a.R.toFixed(0)} m`)
          .bindPopup(`<b>${esc(a.kind)}</b>${a.kind === 'stones' ? (a.ghosts ? ' (ghosts)' : ' (quiet)') : ''}<br>`
            + `R ${a.R.toFixed(1)} m · q ${a.q.toFixed(2)} · ${esc(a.variant || a.aspect)}<br><code>${a.gx},${a.gy}</code>`)
          .addTo(zg);
      }
    }
  }
  for (const [k, g] of Object.entries(groups)) mkRow($('ovl'), 'checkbox', k, false, (on) => on ? g.addTo(map) : map.removeLayer(g));
  // The spawn gate's legend and counts: what each colour refuses, and how
  // much of the loaded ground it covers.
  {
    const tot = gate[0] + gate[1] + gate[2] || 1;
    const pct = (n) => `${(100 * n / tot).toFixed(1)}%`;
    const row = (colour, name, what, n) => `<div style="display:flex;gap:6px;align-items:baseline">`
      + `<span class="sw sq" style="background:${colour}"></span><span>${name} <span style="color:#888">— ${what}</span></span>`
      + `<span class="n">${n.toLocaleString()} · ${pct(n)}</span></div>`;
    const div = document.createElement('div');
    div.style.margin = '4px 0 2px';
    div.innerHTML = `<div style="color:#aaa">Spawn zones</div>`
      + row(SPAWN_GATE_COLOUR.invalid, 'no-spawn', 'all spawn classes blocked', gate[2])
      + row(SPAWN_GATE_COLOUR.suppressed, 'suppressed', 'some spawn classes blocked', gate[1])
      + row('transparent;border:1px solid #666', 'open', 'no zone restriction', gate[0]);
    // Commercial ground by its nearest POI (the overlay above).
    const ctot = com.pub + com.priv + com.none || 1;
    const crow = (colour, name, what, n) => `<div style="display:flex;gap:6px;align-items:baseline">`
      + `<span class="sw sq" style="background:${colour}"></span><span>${name} <span style="color:#888">— ${what}</span></span>`
      + `<span class="n">${n.toLocaleString()} · ${(100 * n / ctot).toFixed(1)}%</span></div>`;
    div.innerHTML += `<div style="color:#aaa;margin-top:4px">Commercial / industrial ground by nearest POI `
      + `(≤ ${WorldGen.NEAREST_POI_MAX_M} m; ${com.seedsPub} public · ${com.seedsPriv} private seeds)</div>`
      + crow(COM_COLOUR.pub, 'public', 'a shop, café, bank … nearest — open', com.pub)
      + crow(COM_COLOUR.priv, 'private', 'an office, hotel, clinic … nearest — PRIVATE', com.priv)
      + crow(COM_COLOUR.none, 'no POI', `none within ${WorldGen.NEAREST_POI_MAX_M} m — PRIVATE`, com.none);
    $('ovl').appendChild(div);
  }
  // STREET VARIANTS (src/street_variants.js): every indexed transportation
  // line (entry.streetIndex.lines) coloured by its variant — the table's own
  // rows and colours (StreetVariants.STREET_VARIANTS, each row's lampGlow),
  // a plain major road as the old trade road (BANDIT_STORY), a plain minor
  // street grey, a rock-lined one dashed. Counts are distinct streets (key).
  if (typeof StreetVariants !== 'undefined' && world.tiles.some((e) => e.streetIndex && e.streetIndex.lines)) {
    const SVx = StreetVariants;
    const layer = L.layerGroup();
    const rows = (SVx.STREET_VARIANTS || []).slice();
    const look = {};
    // A review palette, not the lamp glows: the glows are chosen to suit each
    // theme at night, so several sit close together (two soft greens); here
    // every variant needs a hue of its own. Maximally distinct categorical
    // colours, assigned in table order.
    const PALETTE = ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4',
      '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', '#dcbeff', '#9a6324', '#800000'];
    rows.forEach((r, i) => { look[r.id] = { colour: PALETTE[i % PALETTE.length], label: `${r.title || r.id} (${r.size})` }; });
    const trade = (SVx.BANDIT_STORY && SVx.BANDIT_STORY.title) || 'old trade road';
    look.__major = { colour: '#ffffff', label: `${trade} (major, plain)` };
    look.__minor = { colour: '#8a8a8a', label: 'plain street (minor)' };
    const keys = {};
    const rocky = new Set();
    for (const e of world.tiles) {
      const idx = e.streetIndex;
      if (!idx || !idx.lines) continue;
      const ext = idx.extent || 4096;
      for (const rec of SVx.displayLines(idx, EDGE / ext)) {
        const id = rec.variant || (rec.size === 'major' ? '__major' : '__minor');
        const lk = look[id] || (look[id] = { colour: '#fff', label: id });
        (keys[id] || (keys[id] = new Set())).add(rec.key);
        if (rec.rocks) rocky.add(rec.key);
        const pts = rec.line.map((p) => toLL((e.tx + p.x / ext) * EDGE, (e.ty + p.y / ext) * EDGE, EDGE));
        L.polyline(pts, { color: lk.colour, weight: rec.size === 'major' ? 5 : 3, opacity: 0.9,
          dashArray: rec.rocks ? '6 4' : null })
          .bindPopup(`<b>${esc(lk.label)}</b>${rec.rocks ? ' · rock-lined' : ''}<br>${esc(rec.name || '(unnamed)')}`)
          .addTo(layer);
      }
    }
    // SCENIC STRETCHES (src/scenic.js — feature-detected: the page only has
    // it once index.html loads the module): every walking way's scenic
    // intervals (entry.scenic.lines, MVT arclength units) drawn as the
    // sub-polyline they cover, in their look row's colour (StreetVariants'
    // 'path' rows: promenade / greenway / park path). Counted in km.
    const scenicKm = {};
    if (typeof Scenic !== 'undefined' && typeof Streets !== 'undefined') {
      for (const e of world.tiles) {
        const sc = e.scenic;
        if (!sc || !sc.lines || !sc.lines.size) continue;
        const tr = (e.layers || []).find((l) => l.name === 'transportation');
        if (!tr) continue;
        const ext = tr.extent || 4096;
        const gM = (e.cellsPerEdge * WorldGen.CELL_M) / ext;
        for (const f of tr.features) {
          if (f.type !== 2 || !f.geom) continue;
          for (let li = 0; li < f.geom.length; li++) {
            const ivs = sc.lines.get(Streets.lineKey(f, li));
            if (!ivs) continue;
            for (const iv of ivs) {
              const row = Scenic.rowFor(iv[2]);
              const id = row ? row.id : iv[2];
              const lk = look[id] || (look[id] = { colour: '#0ff', label: id });
              (keys[id] || (keys[id] = new Set())).add(`${e.tx},${e.ty}|${li}|${f.id}`);
              scenicKm[id] = (scenicKm[id] || 0) + (iv[1] - iv[0]) * gM / 1000;
              const sub = Streets.subLineM(f.geom[li], 1, iv[0], iv[1]);
              if (sub.length < 2) continue;
              const pts = sub.map((p) => toLL((e.tx + p.x / ext) * EDGE, (e.ty + p.y / ext) * EDGE, EDGE));
              L.polyline(pts, { color: lk.colour, weight: 4, opacity: 0.95 })
                .bindPopup(`<b>${esc(lk.label)}</b> · ×${Scenic.SCENIC_MUL[iv[2]]} on the ladder<br>${((iv[1] - iv[0]) * gM).toFixed(0)} m`)
                .addTo(layer);
            }
          }
        }
      }
    }
    mkRow($('ovl'), 'checkbox', 'Street variants', false, (on) => on ? layer.addTo(map) : map.removeLayer(layer));
    const order = [...rows.map((r) => r.id), '__major', '__minor'].filter((id) => keys[id]);
    for (const id of Object.keys(keys)) if (!order.includes(id)) order.push(id);
    const div = document.createElement('div');
    div.style.margin = '2px 0 4px';
    div.innerHTML = order.map((id) => `<div style="display:flex;gap:6px;align-items:baseline">`
      + `<span class="sw sq" style="background:${look[id].colour}"></span><span>${esc(look[id].label)}</span>`
      + `<span class="n">${keys[id].size.toLocaleString()}${scenicKm[id] ? ` · ${scenicKm[id].toFixed(1)} km` : ''}</span></div>`).join('')
      + `<div style="display:flex;gap:6px;align-items:baseline"><span style="color:#888">dashed: rock-lined</span>`
      + `<span class="n">${rocky.size.toLocaleString()}</span></div>`;
    $('ovl').appendChild(div);
  }
  // Markers off keeps them COUNTED — the density heatmap reads best bare.
  markersToggle = mkRow($('ovl'), 'checkbox', 'Show markers', !state.markersOff, (on) => {
    state.markersShown = on;
    syncMarkers();
  });
  syncMarkers();
  mkRow($('ovl'), 'checkbox', 'Density per game view', false, (on) => { densityOn = on; on ? densityLayer.addTo(map) : map.removeLayer(densityLayer); });
  // Legend grouped by family, in the families' order, members in theirs.
  const present = new Set([...used].map((c) => names[c] || String(c)));
  const blocks = [];
  for (const f of [...TERRAIN_FAMILIES, { name: 'Other', members: [...present].filter((m) => !TERRAIN_FAMILY[m]) }]) {
    const here = f.members.filter((m) => present.has(m));
    if (!here.length) continue;
    blocks.push(`<div style="color:#aaa;margin-top:6px">${f.name}</div>` + here.map((m) =>
      `<div style="padding-left:6px"><span class="sw sq" style="background:${TERRAIN_COLOUR[m] || 'hsl(0,0%,50%)'}"></span> ${m.toLowerCase().replace(/_/g, ' ')}</div>`).join(''));
  }
  $('legend').innerHTML = blocks.join('');
}

// ── Go ──────────────────────────────────────────────────────────────────────
function rebuild(home) {
  $('status').textContent = 'building the world around Home…';
  setTimeout(() => {
    const t0 = performance.now();
    const world = window.__world = buildWorld(home);
    updateZoneReview(world);
    draw(world, home);
    const s = Math.round((performance.now() - t0) / 100) / 10;
    $('status').textContent = world.errors.length
      ? `built in ${s}s — ${world.errors.length} error(s), see console` : `built in ${s}s`;
    if (world.errors.length) console.warn(world.errors.join('\n'));
    window.__world = world;
  }, 30);
}
(async () => {
  try {
    await loadGame();
    $('status').textContent = 'fetching tiles…';
    await fetchTiles();
    if (!raw.length) { $('status').textContent = 'no tiles'; return; }
    const mid = raw[Math.floor(raw.length / 2)];
    const home = window.__home = { x: (mid.tx + 0.5) * EDGE, y: (mid.ty + 0.5) * EDGE };
    map.setView(toLL(home.x, home.y, EDGE), 16);
    const first = window.__world = buildWorld(home);
    overlays(first);
    updateZoneReview(first);
    draw(first, home);
    $('status').textContent = first.errors.length ? `${first.errors.length} error(s), see console` : 'ready';
    if (first.errors.length) console.warn(first.errors.join('\n'));
    window.__world = first;
    let placing = false;
    $('placeHome').onclick = () => { placing = !placing; $('placeHome').classList.toggle('on', placing); map.getContainer().style.cursor = placing ? 'crosshair' : ''; };
    map.on('click', (ev) => {
      if (!placing) return;
      placing = false; $('placeHome').classList.remove('on'); map.getContainer().style.cursor = '';
      rebuild(window.__home = toM(ev.latlng.lat, ev.latlng.lng, EDGE));
    });
    for (const m of [Difficulty.EASY, Difficulty.HARD]) {
      mkRow($('modes'), 'radio', m, Difficulty.mode() === m, () => { Difficulty.setMode(m); rebuild(window.__home); }, 'mode');
    }
    $('dmin').onchange = $('dmax').onchange = density;
    const setAll = (v) => {
      Object.entries(state.layers).forEach(([k, l]) => { state.shown[k] = v; v ? l.addTo(map) : map.removeLayer(l); });
      document.querySelectorAll('#kinds input').forEach((i) => { i.checked = v; });
      density();
    };
    $('all').onclick = () => setAll(true);
    $('none').onclick = () => setAll(false);
  } catch (e) {
    $('status').textContent = 'failed: ' + e.message;
    console.error(e);
  }
})();
</script>
