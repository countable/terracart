<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimic alignment</title><style>
body{background:#17231c;color:#eee6ce;font:17px/1.5 system-ui;margin:32px}main{max-width:1000px;margin:auto}.row{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;padding:16px;background:#26372b;border:1px solid #536349;border-radius:8px}canvas{width:240px;height:220px;image-rendering:pixelated}figcaption{font-weight:bold}p,small{color:#c6d1c1}p{max-width:800px}</style><main><h1>Mimic alignment</h1><p>Actual game art at six times its displayed size. The new mimic shares the T2 chest’s scale and orange-and-dark-metal palette.</p><div class="row"><figure><canvas id="chest" width="240" height="220"></canvas><figcaption>T2 chest</figcaption><small>Disguise · 18.4 px</small></figure><figure><canvas id="before" width="240" height="220"></canvas><figcaption>Previous mimic</figcaption><small>32 px · original palette</small></figure><figure><canvas id="after" width="240" height="220"></canvas><figcaption>Aligned mimic</figcaption><small>18.4 px · chest palette</small></figure></div><p>The disguise stays identical to the real chest. The revealed mimic retains its teeth and animation.</p></main><script>
const data={"palette":{"preserveUnmapped":true,"colors":{"#000000":"#0d0b11","#916d56":"#c2713d","#a48d43":"#e89155","#424730":"#373e58","#292e22":"#1c1c28","#6d7173":"#fad6b2","#527066":"#965b3f","#689e84":"#c87740"}},"scale":1.1520000000000004,"chestScale":1.1520000000000004,"frames":[27,28,29],"frameMs":180,"source":"assets/Enemy/spr_mini_monsters_spritesheet.png","chest":"assets/ArtTrials/RogueProps/containers/chest.png"};
const recolor=function recolorEnemyPixels(pixels, palette) {
  const rgb = (hex) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const stops = palette.preserveUnmapped ? null : ['#000000', palette.shadow, palette.mid, palette.highlight].map(rgb);
  // Preserve authored details, such as the crow's red eye on a white gull.
  const colors = new Map(Object.entries(palette.colors ?? {}).map(([from, to]) => [parseInt(from.slice(1), 16), rgb(to)]));
  for (let i = 0; i < pixels.length; i += 4) {
    if (!pixels[i + 3]) continue;
    const color = colors.get((pixels[i] << 16) | (pixels[i + 1] << 8) | pixels[i + 2]);
    if (color) {
      for (let ch = 0; ch < 3; ch++) pixels[i + ch] = color[ch];
      continue;
    }
    if (palette.preserveUnmapped) continue;
    const luma = (0.2126 * pixels[i] + 0.7152 * pixels[i + 1] + 0.0722 * pixels[i + 2]) / 255;
    const t = Math.pow(luma, palette.gamma ?? 1) * 3;
    const segment = Math.min(2, Math.floor(t));
    const a = stops[segment], b = stops[segment + 1];
    const f = t - segment;
    for (let ch = 0; ch < 3; ch++) pixels[i + ch] = Math.round(a[ch] + (b[ch] - a[ch]) * f);
  }
  return pixels;
};
async function load(src){const im=new Image();im.src='/'+src.split('?')[0];await im.decode();return im;}
(async()=>{const [sheet,chest]=await Promise.all([load(data.source),load(data.chest)]);const tinted=document.createElement('canvas');tinted.width=sheet.width;tinted.height=sheet.height;const tc=tinted.getContext('2d');tc.drawImage(sheet,0,0);const pixels=tc.getImageData(0,0,tinted.width,tinted.height);recolor(pixels.data,data.palette);tc.putImageData(pixels,0,0);
function draw(id,image,frame,scale){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,240,220);c.strokeStyle='#647458';c.beginPath();c.moveTo(16,184.5);c.lineTo(224,184.5);c.stroke();c.imageSmoothingEnabled=false;const columns=image.width/16,size=16*scale*6;c.drawImage(image,(frame%columns)*16,Math.floor(frame/columns)*16,16,16,120-size/2,184-size,size,size);}
function tick(now){draw('chest',chest,1,data.chestScale);const frame=data.frames[Math.floor(now/data.frameMs)%data.frames.length];draw('before',sheet,frame,2);draw('after',tinted,frame,data.scale);requestAnimationFrame(tick);}requestAnimationFrame(tick);document.documentElement.dataset.ready='true';})();
</script></html>
